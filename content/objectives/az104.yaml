          - id: AZ104-2.3
            text: "Configure stored access policies"
          - id: AZ104-2.4
            text: "Manage access keys"
          - id: AZ104-2.5
            text: "Configure identity-based access for Azure Files"

      - id: cluster-storage-accounts
        title: "Storage accounts"
        objectives:
