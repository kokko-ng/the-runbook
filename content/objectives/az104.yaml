schema_version: 1
exam: az104
title: "Microsoft Azure Administrator (AZ-104)"
act: 1
source_url: "https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104"
fetched_on: "2026-08-17"

# M1 authors the Virtual Networking domain only. M2 fetches the current study
# guide and fills in the remaining four domains before any of them is enforced.
domains:
  - id: az104-d4
    title: "Configure and manage virtual networking"
    chapter: act1-networking
    weight: "15-20%"
    clusters:
      - id: cluster-vnets
        title: "Virtual networks and subnets"
        objectives:
          - id: AZ104-4.1
            text: "Create and configure virtual networks and subnets"
          - id: AZ104-4.2
            text: "Create and configure virtual network peering"

      - id: cluster-nsg
        title: "Network security groups"
        requires: [cluster-vnets]
        objectives:
          - id: AZ104-4.3
            text: "Configure network security groups and application security groups"
          - id: AZ104-4.4
            text: "Evaluate effective security rules and troubleshoot network connectivity"

      - id: cluster-dns
        title: "Azure DNS and name resolution"
        requires: [cluster-vnets]
        objectives:
          - id: AZ104-4.5
            text: "Configure public and private DNS zones and name resolution for virtual networks"

      - id: cluster-routing
        title: "Routing and hybrid connectivity"
        requires: [cluster-vnets]
        objectives:
          - id: AZ104-4.6
            text: "Configure user-defined routes and route tables"
          - id: AZ104-4.7
            text: "Configure hybrid connectivity with VPN gateways and virtual network gateways"

      - id: cluster-loadbalancing
        title: "Load balancing"
        requires: [cluster-vnets]
        objectives:
          - id: AZ104-4.8
            text: "Configure Azure Load Balancer, including health probes and backend pools"
          - id: AZ104-4.9
            text: "Configure Azure Application Gateway and choose an appropriate load balancing solution"
