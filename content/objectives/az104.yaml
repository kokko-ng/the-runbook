schema_version: 1
exam: az104
title: "Microsoft Azure Administrator (AZ-104)"
act: 1
source_url: "https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-104"
fetched_on: "2026-08-17"

# Mirrors the published study guide, skills measured as of April 17, 2026.
# Domains are chapters, the guide's sub-headings are skill tree clusters, and
# each bullet is one objective. Re-fetch the guide before editing: Microsoft
# revises these periodically and the linter enforces full coverage.
domains:
  - id: az104-d1
    title: "Manage Azure identities and governance"
    chapter: act1-identity
    weight: "20-25%"
    clusters:
      - id: cluster-entra-users
        title: "Microsoft Entra users and groups"
        objectives:
          - id: AZ104-1.1
            text: "Create users and groups"
          - id: AZ104-1.2
            text: "Manage user and group properties"
          - id: AZ104-1.3
            text: "Manage licenses in Microsoft Entra ID"
          - id: AZ104-1.4
            text: "Manage external users"
          - id: AZ104-1.5
            text: "Configure self-service password reset (SSPR)"

      - id: cluster-rbac
        title: "Access to Azure resources"
        requires: [cluster-entra-users]
        objectives:
          - id: AZ104-1.6
            text: "Manage built-in Azure roles"
          - id: AZ104-1.7
            text: "Assign roles at different scopes"
          - id: AZ104-1.8
            text: "Interpret access assignments"

      - id: cluster-governance
        title: "Subscriptions and governance"
        requires: [cluster-rbac]
        objectives:
          - id: AZ104-1.9
            text: "Implement and manage Azure Policy"
          - id: AZ104-1.10
            text: "Configure resource locks"
          - id: AZ104-1.11
            text: "Apply and manage tags on resources"
          - id: AZ104-1.12
            text: "Manage resource groups"
          - id: AZ104-1.13
            text: "Manage subscriptions"
          - id: AZ104-1.14
            text: "Manage costs by using alerts, budgets, and Azure Advisor recommendations"
          - id: AZ104-1.15
            text: "Configure management groups"

