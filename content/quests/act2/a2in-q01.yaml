id: a2in-q01
chapter: act2-infrastructure
title: What Should Run Where
summary: Eleven workloads from two companies, and a review board that wants a reason for every placement.
variant: core
estimated_minutes: 15
objectives:
  - AZ305-4.1.1
  - AZ305-4.1.2
brief: >
  The compute chapter of the target architecture. Every choice here is defensible
  in isolation, which is why the requirements matter.
debrief: >
  A compute decision framework the team can apply themselves, and a virtual
  machine design for the workload that genuinely needs one.
encounters:
  - id: a
    type: design
    title: The question before the answer
    speaker: Grace Mendoza
    objectives: [AZ305-4.1.1]
    intro: >
      "Eleven workloads," says Grace. "Somebody is going to ask why dispatch is on
      Kubernetes and the label generator is a container instance and the ERP is on
      virtual machines. I want the reasoning written down once, so the twelfth
      workload places itself."
    hint: >
      Grace asked for reasoning that places the twelfth workload by itself.
      Ask which question must be answered before any comparison of platforms
      means anything at all, and what order the remaining questions come in.
    post_mortem:
      question: >
        Grace turns to the whiteboard. "The twelfth workload still cannot
        place itself with that. What does a decision framework have to do
        that a preference does not?"
      options:
        - id: a
          label: It offered a single preference where an ordering of questions was needed
          correct: true
          explain: >
            Cost, managed-service defaults and team familiarity are all real
            inputs. A framework orders them: hard constraints on the host
            first, then the operational model and scale shape, with the rest
            discriminating only between options that survive.
        - id: b
          label: It should have standardized on one compute platform for everything
          correct: false
          explain: >
            Fewer platforms is worth something, and a single one is not the
            goal. The framework exists because the workloads differ; it
            orders the questions rather than forcing one answer.
        - id: c
          label: It needed more precise cost figures before deciding
          correct: false
          explain: >
            Better numbers do not fix the ordering. A precise price for an
            option the application cannot run on is precise and useless.
    prompt: What drives the compute choice?
    options:
      - id: a
        label: >
          Operating system and runtime constraints first, then operational model, scale shape
          and how much platform the team can run
        correct: true
        rep: 9
        consequence: >
          The framework fits on a page, and the next workload is placed by the team without a
          review.
        explain: >
          Compute selection starts with hard constraints: what the application requires of the
          host, and whether it can be containerized or rewritten at all. Then the operational
          question, of how much of the stack the organization wants to own, then the scale
          shape, which decides between always-on and event-driven. Cost falls out of those
          rather than leading them.
      - id: b
        label: Cost per hour for each option, compared at the expected load
        correct: false
        rep: -6
        consequence: >
          The cheapest compute is chosen for an application that cannot run on it, and the
          rewrite costs more than a decade of the difference.
        explain: >
          Price comparisons between compute options are only meaningful once the options are
          all viable. Constraints come first.
      - id: c
        label: A preference for platform services, falling back to infrastructure when they do not fit
        correct: false
        rep: -5
        consequence: >
          The default is right about eight times out of eleven, and the three exceptions are
          argued from scratch every time.
        explain: >
          Preferring managed services is a sound default and is not a framework. It does not
          say what to do when several managed options fit, which is most of the interesting
          cases.
      - id: d
        label: Whatever each application team is already comfortable operating
        correct: false
        rep: -7
        consequence: >
          Veymark ends up running four compute platforms because four teams each had a
          preference.
        explain: >
          Team familiarity is a real input and it is not the driver. Standardizing on fewer
          platforms is worth something in itself.
  - id: b
    type: design
    title: The workload that needs a machine
    speaker: Marek Sobczak
    objectives: [AZ305-4.1.2]
    intro: >
      "The Straits ERP application tier needs Windows, a specific .NET Framework
      version, an installer that writes to the registry and a license dongle
      emulator," says Marek. "The vendor is gone. It is four servers today and the
      load is flat."
    hint: >
      Two questions hide in here: what the application demands of its host,
      and how the hosts themselves should be run. Answer both; neither one
      alone settles it.
    post_mortem:
      question: >
        Marek waits, marker still capped. "What did that get wrong about an
        application nobody can change?"
      options:
        - id: a
          label: An application that cannot change still deserves infrastructure that can
          correct: true
          explain: >
            The registry writes and the dongle emulator fix the service
            choice; they do not fix the operating model. Machines built from
            an image and replaced rather than patched modernize everything
            around an application nobody can touch.
        - id: b
          label: The application should have been rewritten before migrating
          correct: false
          explain: >
            There is no vendor and no source of change; a rewrite is a
            project the migration cannot wait for. The framework sends
            unchangeable applications to infrastructure on purpose.
        - id: c
          label: Any Windows workload belongs on a platform service
          correct: false
          explain: >
            App Service and containers both require the application to meet
            the platform partway. Installers, machine state and device
            emulation are exactly the requirements they do not meet.
    prompt: How do you run it in Azure?
    options:
      - id: a
        label: >
          A virtual machine scale set in flexible orchestration, from a managed image, across
          zones, with the application installed by the image rather than at boot
        correct: true
        rep: 8
        consequence: >
          Four instances become a scale set that can be patched by replacing instances rather
          than by patching in place.
        explain: >
          When an application cannot be containerized or rewritten, infrastructure as a service
          is the answer, and building it as a scale set from an image gives zone spread,
          repeatable instances and a path to immutable updates without changing the application.
        diagram:
          - {op: set_detail, node: vmss-legacy, detail: "Flexible orchestration, three zones"}
      - id: b
        label: Four individual virtual machines, matching the current design
        correct: false
        rep: -6
        consequence: >
          Four machines drift apart over two years, and patching is done by hand on each.
        explain: >
          Lifting the current shape is the fastest migration and carries forward the
          operational cost. Where a set of identical machines is the reality, model it as a set.
      - id: c
        label: Containerize it on Windows containers to fit the platform standard
        correct: false
        rep: -8
        consequence: >
          The installer, the registry writes and the dongle emulator each fail in a container in
          a different way, with no vendor to ask.
        explain: >
          Containerization needs an owner for the application. A vendor-abandoned application
          with hardware-key emulation is the textbook case for leaving it on a machine.
      - id: d
        label: App Service on Windows, since it runs .NET Framework applications
        correct: false
        rep: -7
        consequence: >
          The application fails on first deploy because it needs an installer and machine-level
          state that App Service does not provide.
        explain: >
          App Service runs .NET Framework web applications well. It does not run installers,
          registry-dependent components or device emulation.
  - id: c
    type: design
    title: Sizing without guessing
    speaker: Priya Raghunathan
    objectives: [AZ305-4.1.2, AZ305-4.1.1]
    intro: >
      "You have asked for four instances of a size I have not seen before," says
      Priya. "The last time somebody sized a migration here, they doubled
      everything on-premises and we paid for it for two years."
    hint: >
      Priya's complaint is about paying for a guess. Ask what evidence
      exists about what these servers actually use, and when a long
      commitment stops being a guess.
    post_mortem:
      question: >
        Priya taps the assessment printout. "Before you quote me another
        number: what decides a size here, and what earns a three-year
        commitment?"
      options:
        - id: a
          label: Measured utilization sets the size; a settled workload earns the commitment
          correct: true
          explain: >
            The assessment already holds the real processor, memory and disk
            numbers, which beat any specification or instinct. Committing
            money for years is only safe once the workload has run and the
            review has confirmed the shape.
        - id: b
          label: Cloud sizing should always start below the estimate to save money
          correct: false
          explain: >
            Starting under the measured peak schedules the first incident
            for the first busy day. Headroom above the measurement is not
            waste; it is the difference between a review and an outage.
        - id: c
          label: Reservations are too risky to use at all
          correct: false
          explain: >
            Reservations are how a steady workload gets cheaper, and Priya
            wants them. The risk is only in buying them before the
            ninety-day review has shown what steady looks like.
    prompt: How do you justify the size?
    options:
      - id: a
        label: >
          Size from the assessment's measured utilization with headroom, commit to a review at
          ninety days, and use reservations only after that
        correct: true
        rep: 8
        consequence: >
          The ninety-day review drops two instances a size, and the reservation is bought
          against the shape that is actually running.
        explain: >
          Migration assessments collect real processor, memory and disk data, which is a better
          basis than the specification of hardware bought five years ago. Reviewing after the
          workload has settled, then committing, is what avoids paying for a guess for three
          years.
      - id: b
        label: Match the on-premises hardware specification, to remove risk from the cutover
        correct: false
        rep: -7
        consequence: >
          Four machines run at eleven per cent utilization for two years, which is the outcome
          Priya described.
        explain: >
          Physical servers are typically bought oversized for a five-year life. Copying that
          into a cloud where capacity is elastic keeps the cost and removes the reason for it.
      - id: c
        label: Start small and scale up when users complain
        correct: false
        rep: -6
        consequence: >
          The complaint arrives during the first month-end run, from finance, to Priya.
        explain: >
          Starting under the measured peak means the first busy period is an incident. Right-size
          from data and review, rather than discovering it in production.
      - id: d
        label: Buy three-year reservations immediately for the discount
        correct: false
        rep: -8
        consequence: >
          The size changes at ninety days and the reservation no longer matches what is running.
        explain: >
          Reservations reward a known steady state. Committing before the workload has settled
          is how organizations end up with capacity they cannot use.
