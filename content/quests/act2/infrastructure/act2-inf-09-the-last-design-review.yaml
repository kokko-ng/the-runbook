schema_version: 1
id: act2-inf-09-the-last-design-review
title: "The Last Design Review"
act: 2
chapter: act2-infrastructure
domain: az305-d4
order: 9
role: solutions-architect
checkpoint: true
summary: "Releases stop happening on Friday evening, and the estate on the map is the one you drew."
entry: e1-pipeline

encounters:
  - id: e1-pipeline
    type: design_decision
    title: "Friday, 18:40"
    speaker: manager
    objectives: [AZ305-4.11]
    scenario: |
      Priya sends the incident summary with no comment. Friday 18:40, a WMS
      release, a missing app setting, ninety minutes of pickers on paper. It is
      the third one this year and all three were Fridays.

      "The board confirmed your title this morning. Solutions architect. The
      first thing on the list is this, because Evelyn asked what our release
      process costs us and I did not have a number."

      What the estate now looks like:

      - 31 services plus infrastructure, across three environments and two regions
      - Deployments are manual: a runbook, a portal, and whoever is free
      - Infrastructure was built by hand in region one and must be identical in region two
      - The acquisition audit requires an approval record and an artifact trail for every production change
      - Credentials for deployment currently live in a shared vault entry that four people use
      - Roughly 30 deployments a week once the Jakarta teams are merged
      - The team uses Git and nothing else; there is no build server
    prompt: "What automated deployment solution do you recommend?"
    options:
      - id: opt-iac-cicd
        label: "Infrastructure as code in Bicep in the same repository as the application, CI/CD pipelines with per-environment stages and approval gates on production, and workload identity federation so the pipeline authenticates without a stored secret"
        correct: true
        explain: >
          Every stated requirement maps to a piece of this. Declarative
          infrastructure in source control is what makes region two identical to
          region one rather than similar to it. Environment stages with approval
          gates produce the approval record and artifact trail the audit asks for,
          automatically, as a by-product of deploying. Workload identity
          federation replaces the shared vault entry with a short-lived,
          per-pipeline token, which removes the credential that four people
          currently know.
        rep: 10
      - id: opt-scripts
        label: "Keep the manual process but standardize it: a scripted deployment run from a jump box, with a checklist and a change ticket per release"
        correct: false
        consequence: >
          The checklist has thirty-one steps. Step nineteen is the app setting
          that took the pickers down.
        explain: >
          Scripts plus checklists improve consistency and leave the failure mode
          intact: a human decides when each step runs, at thirty deployments a
          week, at the end of a Friday. It also leaves the shared credential in
          place and produces an audit trail assembled by hand afterwards rather
          than generated by the deployment itself.
        rep: -8
      - id: opt-portal-export
        label: "Build region two in the portal to match region one, then export ARM templates from both as the record of what exists"
        correct: false
        consequence: >
          The export includes forty-one resources, six of which nobody recognizes,
          and none of the ones that were deleted last month.
        explain: >
          Exported templates describe what happened to be there when you clicked
          export, which is a snapshot rather than a source of truth, and they are
          notoriously unusable for redeployment. Infrastructure as code is
          authoritative in the other direction: the file states the intent and the
          environment is made to match it, which is what "identical in two
          regions" requires.
        rep: -10
      - id: opt-one-pipeline
        label: "One pipeline that builds and deploys all 31 services together on a fixed weekly schedule, so releases are predictable"
        correct: false
        explain: >
          A single coupled release makes the blast radius of every change the
          whole estate, and it makes rollback an all-or-nothing decision. The
          incident you are fixing came from one missing setting in one service; a
          batched weekly release would have shipped it alongside thirty others.
          Predictability comes from small, frequent, independently reversible
          deployments, not from a bigger and rarer one.
        rep: -8
    next: e2-rings

  - id: e2-rings
    type: design_decision
    title: "Releasing on a Tuesday"
    speaker: mentor
    objectives: [AZ305-4.11, AZ305-4.10]
    scenario: |
      Desmond has read the pipeline design and has one objection, which is more
      than he usually offers and less than you expected.

      "Fine. Now tell me what happens when a good pipeline deploys a bad build."

      The constraints:

      - Two regions, active-active for the HTTP workloads, behind Front Door
      - The tracking API has a published 99.9 percent availability target with partners
      - A regression must stop spreading without a human noticing it first
      - Some Jakarta merge behavior has to be enabled for one region before the other
      - Rolling back a database schema change is not always possible; rolling forward usually is
      - NOC Manila is the first to see production, and they are not the deploying team
    prompt: "How do you design the release process on top of the pipeline?"
    options:
      - id: opt-progressive
        label: "Progressive exposure: non-production, then a canary slice of one region with weighted traffic, automated health gates on error rate and latency that halt the rollout, and feature flags in App Configuration so releasing code and enabling behavior are separate decisions"
        correct: true
        explain: >
          Progressive exposure limits how much of the estate a bad build can reach
          before something notices, and automated gates are what make "before a
          human notices" true rather than aspirational. Separating deployment from
          release with feature flags gives two things at once: the per-region
          Jakarta behavior the merge needs, and a way to disable a regression in
          seconds without a redeploy, which matters most where a schema change
          cannot be rolled back.
        rep: 10
        diagram_ops:
          - {op: set_label, node: a2inf-appcs, label: "appcs-meridian (config + feature flags)"}
      - id: opt-both-regions
        label: "Deploy to both regions simultaneously after a full manual test pass in non-production, so the regions never diverge"
        correct: false
        consequence: >
          A regression that non-production did not exercise reaches every partner
          in both regions inside four minutes.
        explain: >
          Keeping regions identical is a real goal and simultaneous deployment
          achieves it by making both regions fail together, which removes the one
          advantage of having two. Brief, deliberate version skew during a
          progressive rollout is the price of a blast radius smaller than the
          estate.
        rep: -10
      - id: opt-bluegreen-manual
        label: "Blue-green slots in each region with a manual verification step before each swap"
        correct: false
        explain: >
          Slot-based blue-green is a sound mechanism and this uses it with a human
          as the health gate. At thirty deployments a week the verification
          becomes a formality, and the stated requirement is that a regression
          stops spreading without a human noticing first. Keep the slots; make the
          gate a query against error rate and latency rather than an opinion.
        rep: -6
      - id: opt-rollback-script
        label: "Keep deploying to both regions at once, but invest in a fast automated rollback script triggered by the on-call engineer"
        correct: false
        consequence: >
          The rollback runs cleanly. The schema migration it tries to reverse does
          not.
        explain: >
          Rollback is a necessary capability and a poor primary strategy, because
          some changes are not reversible - the scenario says so about schema
          migrations. Designing for a smaller exposure in the first place is
          cheaper than designing to undo a full exposure, and feature flags give
          you a reversal path that does not depend on the deployment being
          undoable.
        rep: -8
    next: e3-board

  - id: e3-board
    type: design_decision
    title: "The workload that will not make it"
    speaker: cfo
    objectives: [AZ305-4.12, AZ305-4.1]
    scenario: |
      The architecture review board sits in the big meeting room. Priya, Evelyn,
      Marcus, Desmond, and a reviewer the board hired who has read everything and
      says very little.

      Six weeks to the lease end. Everything has a wave and a date except one
      workload.

      Evelyn puts it on the screen. "The customs OCR product. Your design says
      AKS. The vendor now says their certified Helm chart for the version we need
      ships in the first quarter of next year. That is four months after the
      landlord takes the building."

      What is fixed:

      - The landlord will not renew; the building is being demolished, not relet
      - Customs filing is a legal requirement; Meridian cannot stop processing documents
      - The vendor will not support an uncertified chart, and the OCR handles customs data
      - The AKS cluster is built and running the other vendor services already
      - The vendor's previous release runs on plain Linux VMs and is supported until 2028

      The reviewer looks up. "What do you recommend?"
    prompt: "What do you recommend to the board?"
    options:
      - id: opt-interim-vm
        label: "Rehost the supported VM version into the Sunda landing zone as a dated interim, record it in the migration backlog with an owner and a review date, and move to the certified chart when it ships"
        correct: true
        explain: >
          The lease date is immovable and the certified chart is not available, so
          the only designs left are the ones that get the workload out of the
          building. The vendor's previous release is supported on VMs until 2028,
          which makes rehosting a supported path rather than a compromise. What
          turns it from debt into a plan is the rest of the recommendation: a
          named owner, a review date, and a backlog entry, so the interim expires
          on a date somebody wrote down instead of quietly becoming permanent.
        rep: 12
        diagram_ops:
          - op: add_node
            node:
              id: a2inf-vm-ocr
              label: "OCR (VMs, interim to Q1)"
              kind: vm
              group: grp-sea
              status: warning
          - op: add_edge
            edge: {id: a2inf-e-sunda-vmocr, source: a2inf-sub-sunda, target: a2inf-vm-ocr, kind: dependency}
      - id: opt-extend-lease
        label: "Ask the board to fund a four-month lease extension so the workload can go straight onto the certified chart"
        correct: false
        consequence: >
          Priya makes the call. The building is scheduled for demolition in
          November.
        explain: >
          It is the right question to ask and the scenario has already answered
          it: the landlord will not renew because the building is being
          demolished. A recommendation that depends on a stated constraint being
          untrue is not a recommendation, and the board will notice that you did
          not read the constraint before you spent their money on it.
        rep: -10
      - id: opt-uncertified
        label: "Deploy the uncertified chart on the existing AKS cluster now and take the support risk for four months"
        correct: false
        consequence: >
          Marcus asks what happens when an uncertified build mishandles a customs
          document and the vendor declines the call.
        explain: >
          It hits the date and puts an unsupported configuration in the path of a
          legally mandated process handling customs data. The trade being made is
          four months of convenience against a support and compliance exposure on
          the one workload the scenario identifies as regulated. Interim
          architecture is acceptable; unsupported architecture on a compliance
          path is not.
        rep: -12
      - id: opt-manual
        label: "Retire the OCR capability at the lease end and process customs documents manually until the certified chart ships"
        correct: false
        explain: >
          Retire is a legitimate disposition when a capability has no value, and
          this one has a legal requirement behind it and four months of volume to
          absorb. It converts an infrastructure problem into a headcount problem
          in Jakarta, which is more expensive and slower to reverse than running
          the supported VM version for two quarters.
        rep: -8
    next: e4-handover

  - id: e4-handover
    type: design_decision
    title: "The estate on the map"
    speaker: mentor
    objectives: [AZ305-4.12]
    on_enter_diagram_ops:
      - {op: remove_edge, edge: a2inf-e-files-st}
      - {op: remove_edge, edge: a2inf-e-dc-erp}
      - {op: remove_edge, edge: a2inf-e-dc-files}
      - {op: remove_edge, edge: a2inf-e-sap-erp}
      - {op: remove_node, node: a2inf-sunda-erp}
      - {op: remove_node, node: a2inf-sunda-files}
      - {op: set_label, node: a2inf-sunda-dc, label: "Jakarta office (no data center)"}
      - {op: set_status, node: a2inf-sunda-dc, status: healthy}
      - {op: set_status, node: a2inf-sub-sunda, status: healthy}
      - {op: set_status, node: a2inf-vm-sap, status: healthy}
      - {op: set_status, node: a2inf-sqlmi-sunda, status: healthy}
      - {op: set_status, node: a2inf-st-sunda, status: healthy}
    scenario: |
      The last rack leaves Jakarta on a Thursday. Somebody photographs the empty
      room with the floor fan still in it and puts it in the team channel.

      The handover to NOC Manila is the following Monday. They will run this at
      three in the morning, in a different country, without you.

      Desmond drops into the chair beside your desk with two coffees, which is
      new, and puts one down without saying anything about it.

      "They asked me what to send Manila. I said ask you, because you drew it."

      He turns the monitor slightly so he can see the map. Two regions, a circuit
      to a building that is now just an office, an ERP that boots in Singapore,
      forty-eight terabytes of paper in a storage tier nobody has to think about,
      and a cluster with three node pools and a taint he did not have to
      configure twice.

      "Whatever you send them, they will read exactly one page of it at three in
      the morning. Pick which page."
    prompt: "What goes at the top of the handover pack?"
    options:
      - id: opt-health-model
        label: "A health model per workload: the signals that define healthy, the alert each one raises, the first action, and the owner"
        correct: true
        explain: >
          Operations consume signals, not diagrams. A health model states, per
          workload, what "working" means in measurable terms, which alert fires
          when it stops, what the first action is, and who to wake if that action
          does not work - which is the entire content of a 03:00 decision. It is
          also the artifact the CAF Manage phase is built around, and writing it
          forces you to notice any workload whose health nobody can define. The
          architecture diagram belongs in the pack; it belongs behind this page.


          Desmond reads it twice, which he does not do, and sends it to Manila
          without editing it, which he has never done. "It is the estate you
          designed," he says, standing up. "So it is the estate I get paged
          about. This is the first handover where I know which one of us to be
          annoyed at." He takes his coffee and goes back to his desk. On the map,
          the Jakarta room is an office and everything under it is yours.
        rep: 12
        diagram_ops:
          - {op: set_status, node: a2inf-evhub, status: healthy}
          - {op: set_status, node: a2inf-func-telemetry, status: healthy}
          - {op: set_status, node: a2inf-redis, status: healthy}
          - {op: set_status, node: a2inf-vnet-hub-ea, status: healthy}
          - {op: set_status, node: a2inf-wms-ea, status: healthy}
      - id: opt-architecture
        label: "The full architecture document set, so the NOC understands how everything fits together"
        correct: false
        consequence: >
          Manila acknowledges receipt of one hundred and forty pages. Nobody opens
          it at 03:00.
        explain: >
          The design documentation has to exist and it is reference material, not
          an operational instrument. An engineer holding a pager needs to know
          which signal means which failure and what to do about it; deriving that
          from a topology diagram under time pressure is how the wrong component
          gets restarted.
        rep: -6
      - id: opt-escalation
        label: "The escalation matrix: who to call, in what order, for each system"
        correct: false
        explain: >
          It belongs in the pack and it is the second page, not the first. An
          escalation list with no health model means every alert escalates,
          because the NOC has no basis for deciding whether this one is theirs.
          Give them the signals and the first action, and escalation becomes the
          exception it is supposed to be.
        rep: -5
      - id: opt-repo
        label: "Read access to the infrastructure-as-code repository, since it is the authoritative description of the estate"
        correct: false
        explain: >
          The repository is authoritative about intent and says nothing about
          whether the system is currently well. It is also the wrong altitude at
          03:00: a Bicep module describes how a firewall was declared, not that
          the tracking API's error rate has been above threshold for four minutes.
          Give them the repository too, and give them the health model first.
        rep: -6
    next: END
