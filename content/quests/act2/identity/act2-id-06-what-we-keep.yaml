schema_version: 1
id: act2-id-06-what-we-keep
title: "What We Keep"
act: 2
chapter: act2-identity
domain: az305-d1
order: 6
role: associate-architect
checkpoint: true
summary: "The estate doubled and so did the log bill. Decide what is worth keeping, where, and for how long."
entry: e1-workspace-topology

encounters:
  - id: e1-workspace-topology
    type: design_decision
    title: "Where the logs live"
    speaker: manager
    objectives: [AZ305-1.1]
    on_enter_diagram_ops:
      - op: add_node
        node:
          id: a2id-law-idn
          label: "law-meridian-idn"
          kind: log-analytics
          group: grp-landing
          status: planned
    scenario: |
      The first post-merger invoice arrived and the largest line that was not
      compute was log ingestion. Priya has it open next to the Sunda inventory.

      "Estate is roughly double. Two regions now. And the transition agreement
      says something about logs that I would like you to read before you design
      anything."

      The clause says that operational telemetry generated by Sunda's Indonesian
      operations remains stored in Indonesia for the duration of the agreement,
      which is eighteen months. It was negotiated by lawyers and it is not
      moving.

      Marcus needs the opposite thing. "When I investigate, I need one query
      surface. If I have to open eight workspaces and correlate by hand, I will
      miss something, and the incident that matters will be the one where I do."

      Evelyn's ceiling is four thousand Singapore dollars a month for the
      logging platform, all in.

      Desmond adds the operational note. "Every workspace is another set of data
      collection rules, another retention configuration, and another thing that
      drifts. I have seen an estate with fourteen. Nobody knew what was in nine
      of them."
    prompt: "What Log Analytics workspace topology do you recommend?"
    options:
      - id: opt-central-plus-regional
        label: "One central workspace in Southeast Asia for the Meridian estate, plus a second workspace in Indonesia Central holding only the telemetry the agreement pins there, queried together with cross-workspace queries"
        correct: true
        explain: >
          Centralize by default and split only where a requirement forces it.
          One workspace gives Marcus the single query surface, one set of data
          collection rules, and the ingestion volume needed to qualify for a
          commitment tier. The Indonesian workspace exists for exactly one
          reason - a contractual residency clause - and holds only the data that
          clause covers. Cross-workspace queries and workbooks span both, so the
          investigation experience stays close to single-pane while the clause is
          honored literally.
        rep: 12
        diagram_ops:
          - {op: set_status, node: a2id-law-idn, status: healthy}
          - op: add_edge
            edge:
              id: a2id-e-lawidn-law
              source: a2id-law-idn
              target: law-meridian2
              kind: dependency
              label: "cross-workspace query"
              status: healthy
      - id: opt-single-global
        label: "One workspace in Southeast Asia for the entire estate, including Indonesia, which is the simplest thing to operate and the cheapest to run"
        correct: false
        consequence: >
          Legal reviews the design as part of the quarterly transition report and
          escalates the residency clause to Priya.
        explain: >
          It is the right instinct and it breaks a contractual constraint that is
          stated on the page. A Log Analytics workspace stores its data in the
          region it is created in, so sending Indonesian operational telemetry to
          a Southeast Asia workspace stores it in Singapore, which the transition
          agreement forbids for eighteen months. Simplicity is the default, not
          an override for a legal requirement.
        rep: -10
      - id: opt-per-subscription
        label: "One workspace per subscription, so cost and access naturally follow the subscription boundary"
        correct: false
        consequence: >
          Marcus's first cross-estate hunt takes an afternoon and covers six of
          the eight workspaces. He finds out about the other two later.
        explain: >
          Per-subscription workspaces make chargeback trivial and fail both other
          requirements: the query surface fragments across eight workspaces,
          which is exactly the situation Marcus described as the one where he
          misses something, and splitting ingestion across eight workspaces
          forfeits the volume discount at the commitment tier that the four
          thousand dollar ceiling depends on. Cost attribution is available from
          a single workspace by resource and by tag.
        rep: -8
      - id: opt-per-team
        label: "A workspace per delivery team so each team owns its own telemetry, with the platform team keeping a separate one for infrastructure"
        correct: false
        consequence: >
          Two teams set retention to thirty days to save money. Marcus discovers
          this while investigating something from six weeks earlier.
        explain: >
          Team ownership of telemetry improves engagement and it distributes the
          retention and access decisions that Marcus and the auditors depend on
          being uniform. It reproduces the fourteen-workspace estate Desmond
          described, multiplies data collection rules, and fragments the query
          surface. Workspace-level and table-level RBAC gives teams access to
          their own data inside one workspace without splitting the platform.
        rep: -8
    next: e2-routing

  - id: e2-routing
    type: design_decision
    title: "Three destinations, one pipeline"
    speaker: security
    objectives: [AZ305-1.2]
    on_enter_diagram_ops:
      - op: add_node
        node:
          id: a2id-st-logarchive
          label: "Immutable log archive (7 years)"
          kind: storage-account
          group: grp-platform
          status: planned
    scenario: |
      Marcus brings three requirements that want three different things from the
      same data.

      The outsourced security operations center runs Splunk and wants a stream
      they can consume continuously. They have a connector; they need somewhere
      to connect it to. Batch file drops are not acceptable to them because
      their detections run in near real time.

      Entra sign-in and audit logs must be retained for twelve months. The
      tenant keeps thirty days of sign-in logs on Meridian's licensing, and the
      auditors asked for a year.

      Azure activity logs must be kept for seven years and must be provably
      unaltered. "Chen and Partners used the phrase write once. I did not argue."

      Against that, alerting still has to work: the NOC's alert rules query the
      workspace and cannot be moved, and Evelyn's ceiling has not changed.

      Desmond's contribution is a warning. "Whatever you pick, the Entra logs
      are configured on the tenant, not on a subscription. People forget that
      and then wonder why the table is empty."
    prompt: "How do you route logs to satisfy all three requirements?"
    options:
      - id: opt-fanout
        label: "Diagnostic settings that fan out per destination: Log Analytics for querying and alerting, an Event Hub for the security operations center's Splunk connector, and a storage account with an immutability policy for the seven-year activity log archive"
        correct: true
        explain: >
          A single diagnostic setting can send the same log category to multiple
          destinations at once, and each destination is chosen for what it is
          good at. Log Analytics keeps the workspace queryable so existing alert
          rules keep working and gives twelve-month retention on the Entra
          tables. An Event Hub is the streaming endpoint third-party tools
          consume, which meets the near-real-time requirement without agents.
          Storage with an immutability policy is the cheapest durable home for
          seven years and is what makes write-once a technical control rather
          than a promise. The Entra diagnostic setting is configured at tenant
          scope.
        rep: 12
        diagram_ops:
          - {op: set_status, node: a2id-st-logarchive, status: healthy}
          - op: add_edge
            edge:
              id: a2id-e-law-archive
              source: law-meridian2
              target: a2id-st-logarchive
              kind: dependency
              label: "7-year archive"
              status: healthy
          - op: add_edge
            edge:
              id: a2id-e-entra-law
              source: entra-meridian
              target: law-meridian2
              kind: dependency
              label: "tenant diagnostic setting"
              status: healthy
      - id: opt-law-only
        label: "Send everything to Log Analytics and set seven-year retention on the workspace, then give the security operations center a query account"
        correct: false
        consequence: >
          The revised forecast is roughly triple the ceiling. The security
          operations center says a query account does not fit their detection
          pipeline.
        explain: >
            Long-term retention in the workspace is real and it prices per
            gigabyte per month for seven years across the full ingestion volume,
            which does not fit inside four thousand dollars. It also fails the
            streaming requirement - a query account is a pull interface, not the
            continuous feed the detections need - and workspace retention alone
            is not the write-once control the auditors asked for.
        rep: -8
      - id: opt-storage-only
        label: "Send everything to a storage account, keep costs at the floor, and query it later with a serverless query engine when something is needed"
        correct: false
        consequence: >
          The NOC's alert rules stop firing the morning after the change. Nobody
          notices for nine hours, which is the point.
        explain: >
          Storage is the cheapest destination and it is not a query or alerting
          surface: Azure Monitor alert rules run against a Log Analytics
          workspace or metrics, so routing away from the workspace silently
          disables the alerting the NOC depends on. Cost optimization that
          removes detection is not optimization. Storage belongs in this design
          as the archive tier, not as the only destination.
        rep: -12
      - id: opt-forwarders
        label: "Install Splunk universal forwarders on the virtual machines and let the security operations center collect everything at source"
        correct: false
        consequence: >
          The first detection gap found is a sign-in from an impossible location.
          Entra sign-ins were never on a virtual machine to be forwarded.
        explain: >
          Agent-based collection only sees what runs on a machine you can install
          an agent on. It misses Entra sign-in and audit logs, Azure activity
          logs, and every platform service - App Service, SQL, storage, the
          Application Gateway - which is most of Meridian's estate and all of the
          identity evidence the auditors asked for. Platform logs are collected
          by diagnostic settings, not by forwarders.
        rep: -10
    next: e3-retention-cost

  - id: e3-retention-cost
    type: design_decision
    title: "Two hundred and ten gigabytes a day"
    speaker: cfo
    objectives: [AZ305-1.1, AZ305-1.2]
    scenario: |
      Evelyn has the ingestion breakdown and has done the arithmetic herself,
      which is never a good sign for whoever wrote it.

      Total ingestion after the merger is around two hundred and ten gigabytes a
      day. Of that, one hundred and twenty gigabytes is firewall and Application
      Gateway access logging. The remainder is split between application
      telemetry, platform metrics, and the security tables - sign-ins, audit,
      and Defender alerts.

      "The hundred and twenty. Who queries it?"

      Nobody, routinely. The access logs are read during an incident, and the
      security operations center consumes them from the Event Hub in any case.
      They are not in any dashboard and no alert rule touches them.

      Marcus has the counter-requirement. "The security tables I need
      interactively searchable for twelve months, and I need them in alert rules
      and workbooks. Those are the ones I actually use."

      Evelyn's ceiling is still four thousand a month.

      "I am not asking you to delete anything," she says. "I am asking why we
      are paying the same rate for logs nobody opens as for the ones we build
      alerts on."
    prompt: "How do you bring ingestion cost inside the ceiling?"
    options:
      - id: opt-tiering
        label: "Move the high-volume access log tables to the low-cost logs plan with short interactive retention and long-term retention behind it, keep the security tables on the analytics plan for twelve months, and buy a commitment tier for the remaining volume"
        correct: true
        explain: >
          Table plans exist for this exact split. The access logs keep arriving
          and stay searchable for incident work at a fraction of the analytics
          rate, with long-term retention behind them for the rare older lookup.
          The security tables stay on the analytics plan because that is what
          supports alert rules, workbooks, and twelve-month interactive search,
          which is Marcus's requirement. A commitment tier then discounts the
          remaining daily volume against the pay-as-you-go rate. Nothing is
          deleted, which is what Evelyn actually asked for.
        rep: 12
        diagram_ops:
          - {op: set_status, node: a2id-st-logarchive, status: healthy}
      - id: opt-sampling
        label: "Apply a transformation that randomly samples fifty percent of firewall and gateway access log rows before ingestion"
        correct: false
        consequence: >
          The first investigation after the change reaches a coin flip. The
          connection Marcus is chasing is in the half that was dropped.
        explain: >
          Ingestion-time transformations are a legitimate cost lever when they
          filter rows or columns you can define as irrelevant - health probes,
          a chatty column, a known noisy source. Random sampling is different: it
          destroys the completeness that makes an access log evidence, and an
          incident investigation cannot reason about traffic it has a fifty
          percent chance of having kept. Reduce the price of the data or reduce
          the data deliberately, not statistically.
        rep: -10
      - id: opt-payg
        label: "Stay on pay-as-you-go pricing for everything and ask Evelyn to raise the ceiling to match the new estate size"
        correct: false
        consequence: >
          Evelyn asks whether any option was considered other than paying more.
          It is a short meeting.
        explain: >
          It fails the constraint on the page rather than solving inside it, and
          it leaves a material discount unclaimed - at two hundred and ten
          gigabytes a day, a commitment tier is priced meaningfully below the
          pay-as-you-go rate before any table plan changes. An architect's answer
          to a cost ceiling is a design that fits it or a clear statement of what
          the organization loses by fitting it.
        rep: -8
      - id: opt-31-days
        label: "Drop retention to the included thirty-one days across every table, which costs nothing beyond ingestion"
        correct: false
        consequence: >
          The auditors ask for sign-in evidence from eight weeks ago. There is
          none.
        explain: >
          The included retention period removes retention charges and does
          nothing about ingestion, which is the larger share of this bill, so it
          saves less than it appears to. It also breaks Marcus's twelve-month
          interactive search requirement and the audit evidence obligation
          behind it. Retention is a compliance parameter first and a cost lever
          second.
        rep: -10
    next: e4-monitoring

  - id: e4-monitoring
    type: design_decision
    title: "Nine hundred alerts a month"
    speaker: noc
    objectives: [AZ305-1.3]
    on_enter_diagram_ops:
      - op: add_node
        node:
          id: a2id-monitor
          label: "Azure Monitor alerts and action groups"
          kind: monitor
          group: grp-platform
          status: planned
    scenario: |
      The NOC shift lead has brought a number to the design review and it is not
      a good one.

      "Nine hundred alerts last month. We actioned forty-one. The rest were CPU
      thresholds on machines that are supposed to run hot, disk warnings on
      log volumes that rotate, and every alert firing again during your
      maintenance windows."

      He is honest about the consequence. "Two of my operators have muted the
      warehouse channel. I know. That is why I am telling you rather than
      hiding it."

      What matters to the business is narrower than what is being alerted on.
      The symptom that costs Meridian money is picker login latency in the
      warehouse system - when it goes above four seconds, the floor slows down
      and the shift misses its cut-off. That symptom has never correlated with
      CPU on any individual machine.

      Priya adds the boundary. "Four applications, two regions. No new tooling
      budget - we have Azure Monitor and Application Insights and that is the
      envelope. And the NOC should only be paged for something they can act on
      at 03:00."
    prompt: "What monitoring design do you recommend?"
    options:
      - id: opt-signal-design
        label: "Alert on user-facing signals - Application Insights availability tests and a latency threshold on the picker login journey - plus a small set of platform alerts, routed through action groups by severity with alert processing rules suppressing maintenance windows, and workbooks for everything else"
        correct: true
        explain: >
          Start from the symptom that costs money. A latency threshold on the
          picker login journey and an availability test alert on something a
          user experiences, which is where the four-second number belongs.
          Everything that is diagnostic rather than actionable becomes a workbook
          or a dashboard the NOC consults during an incident instead of a page at
          03:00. Alert processing rules suppress notifications during maintenance
          windows, which removes a whole category of the nine hundred, and
          severity-based action groups mean only actionable severities page a
          human.
        rep: 12
        diagram_ops:
          - {op: set_status, node: a2id-monitor, status: healthy}
          - op: add_edge
            edge:
              id: a2id-e-law-monitor
              source: law-meridian2
              target: a2id-monitor
              kind: dependency
              status: healthy
          - op: add_edge
            edge:
              id: a2id-e-monitor-noc
              source: a2id-monitor
              target: a2id-noc-manila
              kind: dependency
              label: "action group"
              status: healthy
      - id: opt-alert-everything
        label: "Standardize a full metric alert set on every resource - CPU, memory, disk, network - so nothing can happen without the NOC being told"
        correct: false
        consequence: >
          The monthly count goes from nine hundred to fourteen hundred. A third
          operator mutes the channel.
        explain: >
          Coverage of every metric is not the same as coverage of every failure,
          and it actively reduces coverage by training the people on shift to
          ignore the channel. It also fails the stated requirement that the NOC
          be paged only for what they can act on, and it does nothing about the
          symptom the business cares about, since picker login latency has never
          correlated with per-machine CPU.
        rep: -10
      - id: opt-dynamic-thresholds
        label: "Keep the same resource alerts but switch every static threshold to a dynamic threshold so the platform learns normal behavior and only fires on anomalies"
        correct: false
        consequence: >
          Volume falls by half and the four-second login problem still arrives
          via a phone call from the floor supervisor.
        explain: >
          Dynamic thresholds are a genuine improvement over hand-picked static
          numbers and they change how you alert rather than what you alert on.
          The signals are still infrastructure metrics that do not track the
          user-facing symptom, so the failure that matters is still detected by
          a human on the warehouse floor. Fix the choice of signal before tuning
          the threshold on the wrong one.
        rep: -6
      - id: opt-third-party
        label: "Buy a third-party application performance monitoring product with better correlation and route its alerts to the NOC"
        correct: false
        consequence: >
          Priya forwards the quote back with the words no new tooling budget
          highlighted, which is where she got them from.
        explain: >
          A specialist product may well correlate better, and the scenario states
          the envelope is Azure Monitor and Application Insights with no new
          tooling budget. It also would not solve the underlying problem, which
          is that nobody chose which signals justify waking someone up - a new
          tool inherits the same alerting philosophy unless the design changes.
        rep: -8
    next: END
