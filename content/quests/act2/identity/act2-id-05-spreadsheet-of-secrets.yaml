schema_version: 1
id: act2-id-05-spreadsheet-of-secrets
title: "The Spreadsheet of Secrets"
act: 2
chapter: act2-identity
domain: az305-d1
order: 5
role: associate-architect
checkpoint: true
summary: "Sunda kept its credentials in a workbook called passwords_final_v3. Meridian's version is only slightly better named."
entry: e1-vault-topology

encounters:
  - id: e1-vault-topology
    type: design_decision
    title: "How many vaults"
    speaker: security
    objectives: [AZ305-1.8]
    on_enter_diagram_ops:
      - op: add_node
        node:
          id: a2id-kv-platform
          label: "kv-meridian-platform"
          kind: key-vault
          group: grp-platform
          status: planned
      - op: add_node
        node:
          id: a2id-kv-wms
          label: "kv-wms-prod-sea"
          kind: key-vault
          group: grp-sea
          status: planned
    scenario: |
      Due diligence turned up a file on Sunda's file server called
      passwords_final_v3.xlsx. It has forty-one rows and a modification date
      from last Tuesday. Marcus has been quiet about it in a way that is worse
      than shouting.

      "Ours is a OneNote page. I am aware. That is why you are designing this
      one and not defending it."

      The target estate is forty applications across two regions and the four
      workload subscriptions. The requirements come from three directions.

      Marcus: a compromised application must not be able to read another
      application's secrets, and secret access must be attributable per
      identity in the central workspace.

      Desmond: whatever you design has to be created by the same pipeline that
      creates the application, because a vault a human creates by hand is a
      vault nobody deletes.

      Priya: permissions on secrets have to be reviewable by the same process as
      everything else, meaning Privileged Identity Management and access
      reviews. "If a vault has its own private permission model, it is invisible
      to governance and we will find that out during an audit."

      And a deleted vault must be recoverable, because the last one that was not
      cost a weekend.
    prompt: "What Key Vault topology do you recommend?"
    options:
      - id: opt-per-app-rbac
        label: "One vault per application, per environment, per region, with Azure RBAC for the permission model, soft delete and purge protection enabled, and diagnostic logs to the central workspace"
        correct: true
        explain: >
          Vault boundaries are blast radius boundaries: an application compromised
          in Singapore production can reach one vault holding its own secrets, not
          forty. Per environment and per region also keeps the vault in the same
          failure domain as the workload it serves, and it fits a pipeline that
          deploys the application and its vault together. Azure RBAC is what
          satisfies Priya, because role assignments on a vault are governed by the
          same Privileged Identity Management and access review machinery as every
          other Azure role. Soft delete with purge protection makes deletion
          recoverable, and diagnostic logs give per-identity attribution.
        rep: 12
        diagram_ops:
          - {op: set_status, node: a2id-kv-platform, status: healthy}
          - {op: set_status, node: a2id-kv-wms, status: healthy}
          - op: add_edge
            edge:
              id: a2id-e-wms-kv
              source: wms-sea
              target: a2id-kv-wms
              kind: dependency
              status: healthy
      - id: opt-one-vault
        label: "A single central vault for the whole estate, tightly controlled by the platform team, so there is exactly one place to audit"
        correct: false
        consequence: >
          The warehouse system's nightly job and the freight portal's token
          refresh land in the same second. Both get throttled, and neither team
          can see why.
        explain: >
          One place to audit is real, and everything else about it fails. A
          single vault means one application's compromise exposes the estate,
          which is the first requirement. Key Vault service limits are also
          per-vault and shared by every caller inside it, so unrelated workloads
          throttle each other. Central control is achieved by policy and RBAC
          across many vaults, not by one vault.
        rep: -10
      - id: opt-per-team
        label: "One vault per delivery team, so each team owns its own secrets and the number of vaults stays manageable"
        correct: false
        consequence: >
          The freight team's staging application is compromised through a
          dependency. It holds a valid reference to the production database
          secret for the same team's other product.
        explain: >
          Team is an organizational boundary rather than a security one. Two
          applications owned by the same team can have very different exposure -
          an internet-facing staging service and a production payments
          integration - and a shared vault lets a compromise in the first reach
          the secrets of the second. It also mixes environments in one vault,
          which is the most common way production credentials end up on a
          developer's laptop.
        rep: -8
      - id: opt-access-policies
        label: "One vault per application, per environment, per region, using vault access policies to grant get and list permissions to each application identity"
        correct: false
        consequence: >
          The access review runs and returns nothing for any vault. The
          permissions are real; they are just not role assignments.
        explain: >
          The topology is right and the permission model fails Priya's stated
          requirement. Vault access policies live on the vault object itself, are
          not Azure role assignments, and are therefore invisible to Privileged
          Identity Management, to access reviews, and to the role assignment
          reports the auditors will ask for. They are also coarse - permissions
          apply to all objects of a type - where RBAC can scope to an individual
          secret.
        rep: -6
    next: e2-certificates

  - id: e2-certificates
    type: design_decision
    title: "The certificate that expired on a Sunday"
    speaker: mentor
    objectives: [AZ305-1.8]
    scenario: |
      Everyone remembers the outage because it happened during the peak season
      briefing. The wildcard certificate for the customer portal expired at
      08:00 on a Sunday, the portal returned a browser warning for five hours,
      and two freight forwarders phoned Priya directly.

      "The renewal reminder was in a calendar belonging to someone who left,"
      Desmond says. "That is the whole postmortem."

      The estate the design has to cover is wider now. One public wildcard
      certificate terminates on the Application Gateway and is also bound to
      three App Services. The Application Proxy connector at Kallang uses an
      internal certificate issued by Meridian's own certificate authority. And
      Indonesia will need its own gateway certificate before go-live.

      Marcus has one requirement that removes several options: anything a
      customer's browser sees must be issued by a public certificate authority
      that browsers already trust. Meridian has an account with a commercial
      certificate authority.

      Priya has the other. "No bespoke automation the NOC has to support at
      03:00. If it breaks, they need to be able to read a document and fix it,
      not read someone's code."
    prompt: "How do you design certificate management?"
    options:
      - id: opt-kv-integrated-ca
        label: "Key Vault certificates with the commercial certificate authority integrated, auto-renewal at eighty percent of lifetime, and the gateway and App Services referencing the Key Vault certificate rather than holding a copy"
        correct: true
        explain: >
          Key Vault's integrated certificate authority support turns renewal into
          a vault policy rather than a calendar entry, and issuance goes to the
          public authority Marcus requires. The part that prevents the repeat
          outage is the reference: when Application Gateway and App Service bind
          to the Key Vault certificate rather than an uploaded copy, the renewed
          version is picked up without a redeploy, so renewal and rollout are the
          same event. Internal certificates from Meridian's own authority still
          live in the vault with expiry notifications, because that authority is
          not integrated.
        rep: 12
        diagram_ops:
          - op: add_edge
            edge:
              id: a2id-e-kvplatform-wms
              source: a2id-kv-platform
              target: wms-sea
              kind: dependency
              label: "TLS certificate"
              status: healthy
      - id: opt-calendar
        label: "Buy two-year certificates, store them in Key Vault, and put the renewal in a shared team calendar with a ninety-day reminder"
        correct: false
        consequence: >
          The reminder fires. It fires during the Indonesia cutover week, and it
          is snoozed.
        explain: >
          This is the design that already failed, with a better calendar. It
          meets the public authority requirement and leaves renewal as a human
          task with a two-year gap between rehearsals, which is long enough for
          the person who understands the process to change roles. Automating
          renewal is not a luxury on a certificate that terminates customer
          traffic.
        rep: -10
      - id: opt-self-signed
        label: "Issue self-signed certificates from Key Vault with a twelve-month lifetime and full auto-rotation, avoiding certificate authority costs entirely"
        correct: false
        consequence: >
          The portal loads with a full-page interstitial warning. The freight
          forwarders phone Priya again, faster this time.
        explain: >
          Auto-rotation is exactly right and the trust chain is not. A
          self-signed certificate is trusted by nothing a customer owns, so every
          browser reaching the portal shows a warning, which fails Marcus's
          requirement for public authority issuance on anything customer-facing.
          Self-signed certificates from Key Vault are appropriate for internal
          service-to-service use where you control the trust store.
        rep: -12
      - id: opt-acme-function
        label: "Write a Function that runs an ACME client against a free certificate authority, renews every sixty days, and writes the result into Key Vault"
        correct: false
        consequence: >
          Eleven months later the ACME library has a breaking change. The person
          who wrote the Function is now in the data team.
        explain: >
          Free automated certificate authorities are legitimate and widely used,
          and the failure here is the operating model rather than the authority:
          Priya asked for nothing bespoke the NOC has to support, and this makes
          certificate renewal depend on code Meridian maintains, a library that
          changes, and a Function that has to be monitored. Key Vault's built-in
          integration achieves the same outcome as configuration.
        rep: -6
    next: e3-cmk

  - id: e3-cmk
    type: design_decision
    title: "Revoking access to data you already hold"
    speaker: security
    objectives: [AZ305-1.8]
    scenario: |
      The manifest and photo archive holds proof-of-delivery images with drivers
      and recipients in them, which makes it personal data. During due diligence
      Marcus made a commitment in writing.

      "If we are told to stop processing a data set, or if we believe an account
      is compromised, Meridian can render that archive unreadable within one
      hour without deleting it. I wrote that. I would like it to be true."

      He also needs the key to be recoverable, because rendering data
      permanently unreadable by accident is its own incident, and he needs key
      operations logged.

      Evelyn has read the pricing page over your shoulder, which is a habit now.

      "The single-tenant hardware security module pool is roughly two thousand
      three hundred a month before anything is in it. I will fund it if a
      regulator has asked us for it in writing. Has one?"

      They have not. The commitment Marcus made is about revocation, not about
      hardware certification levels, and no regulator has specified a validation
      standard for this archive.
    prompt: "How do you meet the revocation commitment for the archive?"
    options:
      - id: opt-cmk-vault
        label: "Customer-managed keys in a dedicated platform Key Vault with soft delete and purge protection, the storage account using a user-assigned managed identity to reach the key, a rotation policy, and revocation by removing the key access"
        correct: true
        explain: >
          Customer-managed keys put the encryption key under Meridian's control,
          so revoking the storage account's access to that key makes the data
          unreadable within minutes while the blobs remain in place - which is
          precisely the commitment. Soft delete and purge protection are not
          optional here; they are prerequisites for customer-managed keys and
          they are also what makes an accidental revocation recoverable. The
          user-assigned identity keeps the grant stable, and vault diagnostic
          logs record every key operation.
        rep: 12
        diagram_ops:
          - op: add_edge
            edge:
              id: a2id-e-kv-archive
              source: a2id-kv-platform
              target: st-archive2
              kind: dependency
              label: "customer-managed key"
              status: healthy
      - id: opt-mmk
        label: "Keep Microsoft-managed keys, which encrypt everything at rest by default, and control access through RBAC and network restrictions instead"
        correct: false
        consequence: >
          Marcus reads his own commitment back and asks which step in this design
          makes the archive unreadable.
        explain: >
          Platform-managed encryption protects data at rest against physical and
          infrastructure threats and it gives Meridian no key to withhold. There
          is no operation that renders the archive cryptographically unreadable,
          so the one-hour revocation commitment cannot be met. Access controls
          are necessary and they are a different control answering a different
          question.
        rep: -10
      - id: opt-mhsm
        label: "Provision a Managed HSM pool and hold the archive's key material in single-tenant validated hardware"
        correct: false
        consequence: >
          Evelyn approves nothing and asks the question again, in writing, with
          the monthly figure in the subject line.
        explain: >
          Managed HSM meets the requirement and exceeds it at a cost the scenario
          explicitly gates on a written regulatory demand that does not exist.
          Single-tenant validated hardware earns its price when a regulator or
          contract specifies a validation level or sole tenancy of the key
          material. Revocation capability alone is delivered by customer-managed
          keys in a standard vault.
        rep: -6
      - id: opt-app-encrypt
        label: "Encrypt each image in the application before upload, with the key held in the application's configuration"
        correct: false
        consequence: >
          The manifest indexing job stops returning results. It cannot read what
          it is indexing.
        explain: >
          Client-side encryption is a real pattern and this version fails on two
          counts stated in the scenario. The key sits in application
          configuration, so it is neither recoverable in a governed way nor
          logged per operation, and revocation means changing an application
          setting rather than a key permission. It also blinds every Azure
          service that needs to read the blobs, including indexing and lifecycle
          management.
        rep: -8
    next: e4-rotation

  - id: e4-rotation
    type: design_decision
    title: "Rotating something two systems believe in"
    speaker: mentor
    objectives: [AZ305-1.8]
    scenario: |
      One credential resists every clean answer. The ERP integration account is
      a real on-premises Active Directory user, because the ERP will not accept
      anything else, and the warehouse system in Azure signs in as it to call
      the ERP's booking interface.

      Meridian's password standard says it rotates every ninety days. The last
      rotation caused a two-hour outage, and Desmond describes it with relish.

      "Someone reset it in AD on a Friday afternoon. Nobody updated the vault.
      The App Service kept presenting the old password until the account
      locked out, which then broke the nightly reconciliation as well."

      The requirements have been written into the standard since.

      Rotation must not require a deployment or an application restart. The
      change in Active Directory and the change in Key Vault must not be able to
      happen separately. And the NOC must be able to see that a rotation
      succeeded without reading anyone's code.
    prompt: "How do you design rotation for the ERP integration credential?"
    options:
      - id: opt-single-rotation
        label: "One automated rotation that sets the new password in Active Directory and writes the new secret version to Key Vault as a single operation, with applications reading the secret through a versionless Key Vault reference"
        correct: true
        explain: >
          The failure was two half-completed changes, so the fix is to make them
          one change that either succeeds or does not. Writing a new secret
          version rather than replacing the value keeps the previous version
          available while callers pick up the new one. Referencing the secret
          without a version means the application resolves the current version at
          runtime, so no deployment or restart is needed. Key Vault's rotation
          and near-expiry events give the NOC a visible success or failure signal
          without reading code.
        rep: 12
      - id: opt-runbook
        label: "Write a runbook for Desmond to follow every ninety days, with a checklist covering the directory change, the vault update, and a verification step"
        correct: false
        consequence: >
          The Q3 rotation is done correctly. The Q4 rotation falls in the
          Indonesia cutover week and is done by someone else.
        explain: >
          A checklist is what the last outage lacked and it does not satisfy the
          requirement that the two changes cannot happen separately - a human
          following steps can still complete step one and be interrupted before
          step two. It also puts a ninety-day recurring manual task on one person
          for a credential that fails silently until an account lockout.
        rep: -8
      - id: opt-pin-version
        label: "Have the applications reference a specific secret version and redeploy them after each rotation, so the exact credential in use is always explicit"
        correct: false
        consequence: >
          Rotation now requires a change window for four applications across two
          regions. The next one is deferred, and then the one after that.
        explain: >
          Version pinning makes the credential in use auditable and breaks the
          requirement that rotation need no deployment. Coupling a routine
          security operation to a release process is how ninety-day rotations
          become annual ones, and the reconciliation Function would need its own
          deployment on the same day or it presents the old value.
        rep: -8
      - id: opt-gmsa
        label: "Replace the account with a group managed service account so Active Directory handles password rotation automatically and no secret needs storing"
        correct: false
        consequence: >
          The App Service cannot retrieve the managed password. It is not domain
          joined and never will be.
        explain: >
          Group managed service accounts are the correct answer when the consumer
          is a domain-joined Windows host, and they are unavailable here because
          the caller is an Azure App Service with no domain membership - the
          password is retrieved from the directory by machines authorized in the
          account's principals list. Knowing why the elegant option does not
          apply is the point; the platform the caller runs on decides it.
        rep: -6
    next: END
