id: a2id-q03
chapter: act2-identity
title: The ERP Nobody Will Rewrite
summary: Straits runs on an ERP from 2016 that speaks Kerberos, and its certificate expires in November.
variant: core
estimated_minutes: 15
objectives:
  - AZ305-1.2.4
  - AZ305-1.2.5
brief: >
  Some applications cannot be modernized this year. The design has to give them
  modern access controls anyway.
debrief: >
  Remote access without a VPN client, and a place for keys and certificates that
  is not a spreadsheet in Port Klang.
encounters:
  - id: a
    type: design
    title: Reaching an application that cannot be moved
    speaker: Grace Mendoza
    objectives: [AZ305-1.2.4]
    intro: >
      "Straits ERP runs on two Windows servers in Port Klang," says Grace. "It
      authenticates with integrated Windows authentication. Twenty Veymark
      finance staff need it from the Singapore office and from home, and it cannot
      be published to the internet."


      Migrating it is on the roadmap for next year. This is about the next twelve
      months.
    hint: >
      Weigh what each design actually grants: one application to named users,
      or a network to devices, or a session to a server. The requirement is
      twenty people and one web application, nothing wider.
    post_mortem:
      question: >
        Grace circles the words "cannot be published to the internet" on the
        requirement. "Take it again from there. What is the smallest thing this
        design needs to grant, and to whom?"
      options:
        - id: a
          label: One application, to twenty authenticated users, with no inbound door
          correct: true
          explain: >
            Application proxy publishes exactly the application through an
            outbound connector, and Conditional Access decides who walks in.
            Granting a network, a public listener or a remote desktop session
            hands over more than the requirement names.
        - id: b
          label: Remote access, which means getting users onto the Port Klang network
          correct: false
          explain: >
            That equation is the habit this design breaks. Network reach brings
            every neighboring system with it; publishing brings one application
            and nothing else.
        - id: c
          label: A faster migration, so the legacy application stops mattering
          correct: false
          explain: >
            The migration is next year's roadmap either way. The next twelve
            months still have to be safe, which is a publishing problem, not a
            scheduling one.
    prompt: What do you recommend?
    options:
      - id: a
        label: >
          Publish it through Microsoft Entra application proxy with Kerberos constrained
          delegation, protected by Conditional Access
        correct: true
        rep: 9
        consequence: >
          Finance sign in with their Veymark account, get a multi-factor prompt on an
          unfamiliar device, and reach an ERP that thinks they authenticated with Kerberos.
        explain: >
          Application proxy publishes an internal web application through Entra without
          opening inbound ports: a connector in the data center makes an outbound connection.
          Constrained delegation lets the connector obtain a Kerberos ticket on the user's
          behalf, so a legacy application gets modern authentication and Conditional Access
          in front of it.
        diagram:
          - {op: add_node, node: entra-appproxy}
          - {op: add_edge, edge: e2-appproxy-erp}
      - id: b
        label: A point-to-site VPN for the finance staff into the Port Klang network
        correct: false
        rep: -6
        consequence: >
          Twenty laptops get a VPN client, the helpdesk gets the calls, and a device on the
          VPN reaches far more than the ERP.
        explain: >
          A VPN grants network access and then relies on the application for authorization. It
          is a much larger grant than publishing one application, and it puts a client on every
          device.
      - id: c
        label: Publish the ERP through the firewall with a public address and an IP allow list
        correct: false
        rep: -10
        consequence: >
          A 2016 application with integrated Windows authentication is exposed to the
          internet, behind an address list that changes.
        explain: >
          This is the design that produces incident reports. Inbound exposure of a legacy
          application is precisely what application proxy exists to avoid.
      - id: d
        label: Azure Bastion into a jump box on the Port Klang network
        correct: false
        rep: -7
        consequence: >
          Finance staff work inside a remote desktop session to use a web application, and
          twenty concurrent sessions need a much larger jump box.
        explain: >
          Bastion is for administrative access to virtual machines, and it is not a way to
          publish a business application to twenty end users.
  - id: b
    type: design
    title: Where the keys live
    speaker: Wei Lin Tan
    objectives: [AZ305-1.2.5]
    intro: >
      "Three separate problems keep arriving as one," says Wei Lin. "Application
      secrets, TLS certificates for the public sites, and the encryption keys the
      customer contracts say we must control."


      One customer contract requires keys in hardware that Veymark alone
      controls, with a compliance attestation. The rest are ordinary.
    hint: >
      One requirement in that pile is contractual and hardware-shaped; the rest
      are ordinary. Sort the material by what each piece actually requires, and
      price the special handling only for the piece that requires it.
    post_mortem:
      question: >
        Wei Lin sets the customer contract next to your proposal. "Read them
        together and tell me the principle. What decides where a key, a secret
        or a certificate belongs?"
      options:
        - id: a
          label: The strictest requirement that actually applies to that piece of material
          correct: true
          explain: >
            The contractual keys need single-tenant, validated hardware, which
            is Managed HSM and its price. Everything else needs Key Vault's
            lifecycle and nothing more. One answer for all of it either fails
            the contract or overpays for the ordinary.
        - id: b
          label: Consolidation, because one store is easier to audit than two
          correct: false
          explain: >
            One place to look is worth something, and it cannot override what
            the services store. Managed HSM holds keys only, so a single store
            fails either the ordinary material or the contract.
        - id: c
          label: Cost, because most of this material is low value
          correct: false
          explain: >
            Cost breaks ties; it does not settle requirements. The contractual
            keys are expensive to hold properly and more expensive to hold
            wrongly.
    prompt: What do you recommend?
    options:
      - id: a
        label: >
          Key Vault for secrets and certificates with autorotation, and a Managed HSM for the
          keys under the contractual requirement
        correct: true
        rep: 9
        consequence: >
          Certificates renew themselves, secrets are referenced rather than copied, and the
          contract requirement is satisfied by a service with the attestation attached.
        explain: >
          Key Vault stores secrets, certificates and keys with access controlled by Entra, and
          can issue and rotate certificates from an integrated authority. Managed HSM gives a
          single-tenant, FIPS 140-3 Level 3 validated pool for keys where the contract or
          regulator requires it, at a cost that only makes sense for those keys.
        diagram:
          - {op: add_node, node: kv-platform}
          - {op: add_node, node: managed-hsm}
          - {op: add_edge, edge: e2-mi-kv}
          - {op: add_edge, edge: e2-hsm-data}
      - id: b
        label: One Managed HSM for everything, so there is a single place to look
        correct: false
        rep: -7
        consequence: >
          Ordinary application secrets are now stored in the most expensive key service Azure
          offers, and it does not store secrets at all.
        explain: >
          Managed HSM holds keys, not secrets or certificates. It is a specialized service
          with a price to match, appropriate for the keys that require it.
      - id: c
        label: Key Vault for everything, with the premium tier for the contractual keys
        correct: false
        rep: -5
        consequence: >
          The customer's auditor asks for single-tenant hardware and premium key vaults are
          shared.
        explain: >
          Premium Key Vault uses hardware security modules and is multi-tenant. Where a
          contract requires sole control and a specific validation level, Managed HSM is the
          service that meets it.
      - id: d
        label: Key Vault for secrets, and let each application manage its own certificates
        correct: false
        rep: -6
        consequence: >
          A certificate expires on a Sunday in November and the tracking portal goes dark.
        explain: >
          Certificate lifecycle is the part people forget until it fails. Centralizing issuance
          and renewal is most of the value of using a vault at all.
  - id: c
    type: troubleshoot
    title: DRV-1104
    speaker: Marek Sobczak
    objectives: [AZ305-1.2.5, AZ305-1.2.4]
    intro: >
      The proof of concept is built. Finance can reach the ERP through the
      application proxy, and it works for eighteen of the twenty users.


      The other two get a single sign-on failure and are prompted for credentials
      by the ERP itself, which then rejects them. Both are recent joiners.


      This is a design review, so the artifacts are configuration rather than an
      outage, and Grace wants the cause named before the write-up.
    hint: >
      Eighteen work, two do not, and the two share a history. Ask what the
      sign-on process must produce for each user, and what it needs on the
      other side to produce it.
    post_mortem:
      question: >
        Marek starts the write-up and leaves the cause line blank. "Fill this
        in properly. What did the two failing users lack, and which of our
        settings could have supplied it?"
      options:
        - id: a
          label: An on-premises account to delegate for, which no setting can supply
          correct: true
          explain: >
            Kerberos constrained delegation impersonates a real domain account,
            and a cloud-only user has none. Mappings, connectors and sign-on
            modes all assume that account exists; none of them can create it.
        - id: b
          label: A correct attribute mapping between their cloud and domain names
          correct: false
          explain: >
            The mapping translates between two identifiers when both exist. For
            these two users there is nothing on the domain side to translate
            to, which is a different class of problem.
        - id: c
          label: A healthier path between the connector and the domain controller
          correct: false
          explain: >
            The same connectors mint tickets for eighteen colleagues all day.
            Plumbing that works per application does not fail per user along a
            joining date.
    ticket:
      ref: DRV-1104
      opened: "14:00"
      reporter: Marek Sobczak
      summary: Application proxy single sign-on fails for two of twenty pilot users.
      severity: sev3
    time_budget: 4
    investigate:
      - id: a
        action: Ask what is different about the two users
        speaker: Marek Sobczak
        reveals: >
          "Both joined after the Straits acquisition. Both are cloud-only Veymark
          accounts. The other eighteen are synchronized from the Jurong domain."
      - id: b
        action: Ask how the ERP identifies a user
        speaker: Grace Mendoza
        reveals: >
          "Integrated Windows authentication against straitsfreight.local. It needs a
          Kerberos ticket for a real account in a domain it trusts."
    commands:
      - id: a
        label: Check how the application is configured to sign users in
        cmd: az rest --method get --url "https://graph.microsoft.com/v1.0/applications?$filter=displayName eq 'Straits ERP'&$select=onPremisesPublishing"
        output: |
          {
            "onPremisesPublishing": {
              "singleSignOnSettings": {
                "kerberosSignOnSettings": {
                  "kerberosServicePrincipalName": "HTTP/erp.straitsfreight.local",
                  "kerberosSignOnMappingAttributeType": "userPrincipalName"
                },
                "singleSignOnMode": "onPremisesKerberos"
              }
            }
          }
        time_cost: 1
      - id: b
        label: Check one of the failing users
        cmd: az ad user show --id nadia.rahman@veymarklogistics.com --query "{upn:userPrincipalName,onprem:onPremisesUserPrincipalName,sync:onPremisesSyncEnabled}" -o json
        output: |
          {
            "onprem": null,
            "sync": null,
            "upn": "nadia.rahman@veymarklogistics.com"
          }
        time_cost: 1
      - id: c
        label: Check a working user for comparison
        cmd: az ad user show --id tomas.lim@veymarklogistics.com --query "{upn:userPrincipalName,onprem:onPremisesUserPrincipalName,sync:onPremisesSyncEnabled}" -o json
        output: |
          {
            "onprem": "tomas.lim@veymark.local",
            "sync": true,
            "upn": "tomas.lim@veymarklogistics.com"
          }
        time_cost: 1
      - id: d
        label: Check the connector's own health
        cmd: az rest --method get --url "https://graph.microsoft.com/v1.0/onPremisesPublishingProfiles/applicationProxy/connectorGroups"
        output: |
          {
            "value": [ { "name": "Port Klang", "connectorCount": 2, "status": "active" } ]
          }
        time_cost: 1
    post_incident:
      path: [b, c]
      text: >
        Two user lookups settle this. The failing account shows no on-premises
        identity and no sync; the working one shows both. Kerberos constrained
        delegation can only impersonate an account that exists in the domain,
        so that pair of outputs is the whole diagnosis. The application
        configuration cannot move it, because the sign-on settings are
        identical for all twenty users and eighteen of them work. Connector
        health cannot move it either; infrastructure shared by the working
        eighteen does not selectively fail two accounts by joining date. When a
        fault splits users into two populations, diff the populations before
        you touch the plumbing.
    fixes:
      - id: a
        label: >
          Give the two users on-premises accounts that the proxy can delegate for, or move the
          ERP to a modern authentication path for them
        correct: true
        rep: 9
        consequence: >
          Both get synchronized accounts within the week, and the design document records the
          constraint in bold.
        explain: >
          Kerberos constrained delegation needs an on-premises account to impersonate. A
          cloud-only user has no such account, so single sign-on cannot produce a ticket for
          them. That constraint has to be in the design, because it decides who can use the
          application at all until it is modernized.
        diagram:
          - {op: set_detail, node: sf-erp, detail: "Published through application proxy"}
      - id: b
        label: Change the sign-on mapping attribute to the on-premises SAM account name
        correct: false
        rep: -6
        consequence: >
          The eighteen working users break, because their tickets were being issued against
          the attribute that was there.
        explain: >
          The mapping attribute matters when the on-premises identifier differs from the cloud
          one. It cannot conjure an on-premises account where none exists.
      - id: c
        label: Add a second connector in Singapore to improve delegation
        correct: false
        rep: -7
        consequence: >
          Latency improves for nobody in particular and the two users still cannot sign in.
        explain: >
          Connector placement affects performance and resilience. The failure is an identity
          mapping problem, and the connectors are healthy.
      - id: d
        label: Switch the application to header-based single sign-on
        correct: false
        rep: -8
        consequence: >
          The ERP ignores the headers, because it authenticates with integrated Windows
          authentication and always has.
        explain: >
          Header-based sign-on works for applications that accept identity in headers, often
          with a third-party product in front. It is not a substitute for Kerberos on an
          application that only speaks Kerberos.
