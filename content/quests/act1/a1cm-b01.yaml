id: a1cm-b01
chapter: act1-compute
title: Peak Season Scaling, Exam Hard
summary: The scale set works. It also removes the instance that is halfway through a batch, twice a day.
variant: bonus
bonus_of: a1cm-q06
estimated_minutes: 11
objectives:
  - AZ104-3.2.7
  - AZ104-3.2.4
brief: >
  Autoscale is easy to turn on and easy to get subtly wrong. Every option here is
  something that appears in a real configuration.
debrief: >
  Scale in has to be as deliberate as scale out, and the instance doing work is
  not always the one with the highest processor.
encounters:
  - id: a
    type: troubleshoot
    title: INC-4760
    speaker: Joana Reyes
    objectives: [AZ104-3.2.7]
    intro: >
      "Twice a day, a batch of scanner uploads is lost," says Joana. "Not failed.
      Lost. The message is taken off the queue and never processed, and it always
      happens within a minute of the set scaling in."


      The scale set has autoscale on queue length, out at ten messages per
      instance, in at five, with a one-minute cool-down.


      Four time units. The next scale-in event is in about twenty minutes.
    hint: >
      Nothing here is deleting messages; the clock and the visibility timeout
      explain what the depots see. Ask what an instance would need in order
      to finish or hand back its work before the platform takes the instance
      away.
    post_mortem:
      question: >
        Marek watches the twenty-minute clock with you. "The set is allowed
        to take instances away. What has to be true for that to be safe?"
      options:
        - id: a
          label: The instance gets warning enough to finish or release its work
          correct: true
          explain: >
            Terminate notifications give a defined window, and a worker that
            releases its message turns a five-minute disappearance into
            nothing. Scale-in stays, the saving stays, the batch survives.
        - id: b
          label: Scale-in happens rarely enough that the losses stay acceptable
          correct: false
          explain: >
            Frequency tuning shrinks the incident without ending it; the
            instance still dies mid-message on the days it happens. Twice a
            day or once, Joana files the same ticket.
        - id: c
          label: The queue re-delivers fast enough that nobody notices the gap
          correct: false
          explain: >
            The timeout is not slack to trim; it must outlast the worst-case
            processing time or healthy workers get messages handed out
            twice. The gap was the symptom, not the setting.
    ticket:
      ref: INC-4760
      opened: "11:20"
      reporter: Joana Reyes
      summary: Uploads disappear from the queue around scale-in events.
      severity: sev2
    time_budget: 4
    investigate:
      - id: a
        action: Ask how the worker handles shutdown
        speaker: Marek Sobczak
        reveals: >
          "It takes a message, processes it for up to forty seconds, then deletes it. If
          the process dies in the middle, the message becomes visible again after its
          timeout. Which is five minutes."
      - id: b
        action: Ask what the queue looks like after an event
        speaker: Veymark NOC
        reveals: >
          "Message count dips, then recovers a few minutes later. So they do come back.
          The application that reads them has already reported the upload as failed by
          then."
    commands:
      - id: a
        label: Check the autoscale profile
        cmd: az monitor autoscale show -n autoscale-intake -g rg-app --query "profiles[0].rules[].{metric:metricTrigger.metricName,dir:scaleAction.direction,cooldown:scaleAction.cooldown}" -o table
        output: |
          Metric                  Dir        Cooldown
          ----------------------  ---------  ----------
          ApproximateMessageCount  Increase   PT1M
          ApproximateMessageCount  Decrease   PT1M
        time_cost: 1
      - id: b
        label: Check whether instances are being removed abruptly
        cmd: az monitor activity-log list --offset 6h --query "[?contains(operationName.value,'virtualMachineScaleSets/delete')].{at:eventTimestamp,status:status.value}" -o table
        output: |
          At                        Status
          ------------------------  ---------
          2026-08-24T09:41:12Z      Succeeded
          2026-08-24T11:02:44Z      Succeeded
        time_cost: 1
      - id: c
        label: Check for a termination notification setting on the set
        cmd: az vmss show -n vmss-intake -g rg-app --query "virtualMachineProfile.scheduledEventsProfile" -o json
        output: |
          null
        note: Scheduled events are not enabled, so instances get no warning before they are removed.
        time_cost: 1
      - id: d
        label: Check how long a worker takes to finish a message
        cmd: az monitor metrics list --resource vmss-intake -g rg-app --resource-type Microsoft.Compute/virtualMachineScaleSets --metric "Percentage CPU" --interval PT1M --query "value[0].timeseries[0].data[-2:]" -o table
        output: |
          Average    TimeStamp
          ---------  -------------------
          38.4       2026-08-24T11:18:00Z
          41.9       2026-08-24T11:19:00Z
        time_cost: 1
    post_incident:
      path: [b, c]
      text: >
        The activity log ties the mechanism to the clock: scale set delete
        operations at 09:41 and 11:02, the same minutes the batches vanish.
        The scheduled events reading supplies the why: null, so no instance
        ever hears that it is about to be removed, and a worker dies holding
        a message that stays invisible for five minutes. Event times plus a
        missing warning is the whole story. The autoscale profile only
        restates thresholds the ticket already quoted, and a processor
        average around forty says the fleet is comfortable, which was never
        the complaint.
    fixes:
      - id: a
        label: >
          Enable terminate notifications on the scale set and have the worker finish or release
          its message when it receives one
        correct: true
        rep: 10
        consequence: >
          The next scale-in gives each instance its notice, workers release their messages,
          and nothing is reported as failed.
        explain: >
          Scale-in removes instances without waiting for whatever they were doing. Terminate
          notifications give the instance a defined window to shut down cleanly, which is how
          a queue worker finishes or releases its current message. The message was never lost;
          it was invisible for five minutes, which the caller experienced as a failure.
      - id: b
        label: Raise the scale-in threshold so the set scales in less often
        correct: false
        rep: -7
        consequence: >
          It happens once a day instead of twice, which is a smaller version of the same
          incident.
        explain: >
          Tuning frequency reduces exposure without addressing the cause. The instance still
          dies mid-message whenever it does happen.
      - id: c
        label: Reduce the queue message visibility timeout from five minutes to thirty seconds
        correct: false
        rep: -8
        consequence: >
          Messages become visible again while a healthy worker is still processing them, and
          uploads start being processed twice.
        explain: >
          The visibility timeout has to be longer than the worst-case processing time, or
          messages are handed out twice. Shortening it trades a rare loss for a routine
          duplicate.
      - id: d
        label: Disable scale-in entirely and remove instances manually
        correct: false
        rep: -6
        consequence: >
          February arrives with the set at its peak size, which is the problem the scale set
          was introduced to solve.
        explain: >
          It is a real option for workloads that cannot tolerate interruption and it gives up
          the saving. Terminate notifications keep both.
  - id: b
    type: design
    title: Uniform or flexible
    speaker: Marek Sobczak
    objectives: [AZ104-3.2.7, AZ104-3.2.4]
    intro: >
      A second scale set is being planned for the reporting workers. These are not
      identical: two of them need a larger size with more memory for the month-end
      run, and the team wants to be able to attach a data disk to one of them for
      a migration.
    hint: >
      List what the reporting workers actually need: two different sizes and
      a disk on one instance. Ask which mode treats an instance as a full
      virtual machine, and which one stamps copies from a single model.
    post_mortem:
      question: >
        Marek adds the month-end sizes to the requirements sheet.
        "Orchestration modes are not a style choice. What decides between
        them?"
      options:
        - id: a
          label: Whether the instances must be allowed to differ
          correct: true
          explain: >
            Two larger machines and a one-off data disk are per-instance
            differences, and flexible orchestration treats each instance as
            a standard virtual machine. Uniform trades that away for
            efficient scale from a single model.
        - id: b
          label: Which mode is newer, since defaults exist to be followed
          correct: false
          explain: >
            Flexible is the current default, and that is not the argument.
            The requirements decide; a fleet of thousands of identical
            stateless workers would point the other way.
        - id: c
          label: Whether scale sets suit non-identical machines at all
          correct: false
          explain: >
            Stepping back to hand-managed machines in an availability set
            recreates exactly the shape flexible orchestration replaces, and
            month end gets deployed by hand at 23:00.
    prompt: Which orchestration mode do you choose?
    options:
      - id: a
        label: >
          Flexible orchestration, which manages the instances as individual virtual machines
        correct: true
        rep: 7
        explain: >
          Flexible orchestration is the current default and treats each instance as a standard
          virtual machine, so instances can differ, can be managed individually, and support
          the full virtual machine feature set. Uniform orchestration is the older model built
          for large numbers of identical instances from one model.
      - id: b
        label: Uniform orchestration, because scale sets are for identical instances
        correct: false
        rep: -6
        consequence: >
          The migration disk cannot be attached to one instance, and the workaround becomes a
          separate machine outside the set.
        explain: >
          Uniform is exactly that: every instance comes from one model. It scales to very
          large counts efficiently and gives up per-instance flexibility.
      - id: c
        label: Neither. Use individual virtual machines and an availability set.
        correct: false
        rep: -5
        consequence: >
          Month end needs two more workers and somebody deploys them by hand at 23:00.
        explain: >
          That is the shape flexible orchestration exists to replace: availability set style
          placement with scale set management on top.
  - id: c
    type: knowledge
    title: What resizing costs you
    speaker: Marek Sobczak
    objectives: [AZ104-3.2.4]
    intro: >
      "Somebody asks you to move a production machine from a D-series to an
      E-series size, in the same region, same family generation. What do you tell
      them it costs in downtime, and what would make it worse?"
    hint: >
      Separate the guaranteed cost from the conditional one. Every resize
      pays a restart; ask what has to happen when the current host cluster
      cannot offer the target size, and what that extra step releases.
    question: What happens when you change a virtual machine's size?
    options:
      - id: a
        label: >
          A restart, and if the target size is not available on the current host cluster the
          machine must be deallocated first
        correct: true
        rep: 6
        explain: >
          Resizing restarts the machine. If the requested size is supported by the hardware
          cluster the machine is already on, that is all it takes; if it is not, the machine
          has to be deallocated and started again, which also releases any dynamic public IP
          address and the contents of the temporary disk.
      - id: b
        label: Nothing. Resizing is a live operation with no interruption.
        correct: false
        rep: -5
        consequence: A resize is scheduled during business hours and the application goes down for three minutes.
        explain: >
          There is no in-place live resize for a virtual machine. Plan a restart, and plan for
          a deallocation if the size family changes.
      - id: c
        label: The machine is rebuilt from its image, so anything on the temporary disk is lost
        correct: false
        rep: -5
        consequence: A rebuild is expected and a change window is booked that is four times longer than needed.
        explain: >
          The managed disks are kept and the operating system is not reinstalled. The
          temporary disk is lost on deallocation, which is a smaller and more specific claim.
