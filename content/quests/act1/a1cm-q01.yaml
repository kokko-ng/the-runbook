id: a1cm-q01
chapter: act1-compute
title: Reading Somebody Else's Template
summary: The transport application is deployed from a template nobody has opened since the consultant left.
variant: core
estimated_minutes: 14
objectives:
  - AZ104-3.1.1
  - AZ104-3.1.2
brief: >
  Before you can change how something is deployed, you have to be able to read
  what it currently says. That is today.
debrief: >
  One parameter, one output, and a template that no longer hard-codes a size
  somebody chose in 2023.
encounters:
  - id: a
    type: design
    title: What this template does
    speaker: Marek Sobczak
    objectives: [AZ104-3.1.1]
    intro: >
      Marek puts a fragment on the screen. It is the part of tms-vm.json that
      everyone skips.


      "parameters": { "vmSize": { "type": "string", "defaultValue": "Standard_D2s_v5",
      "allowedValues": ["Standard_D2s_v5", "Standard_D4s_v5"] } },
      "variables": { "nicName": "[concat(parameters('vmName'), '-nic')]" },
      "resources": [ { "type": "Microsoft.Compute/virtualMachines",
      "apiVersion": "2024-07-01", "dependsOn": ["[resourceId('Microsoft.Network/networkInterfaces',
      variables('nicName'))]"] } ]


      "Tell me what happens if I deploy this with no parameter file at all."
    hint: >
      Read the parameters block the way validation reads it: which value has
      something to fall back on, and which does not. The other keywords
      restrict and order; neither of them ever supplies a value.
    post_mortem:
      question: >
        Marek waits while you reread the fragment. "The file has not changed
        since you answered. Tell me the rule you applied that it does not
        actually contain."
      options:
        - id: a
          label: Only a defaultValue makes a parameter optional; nothing else supplies a value
          correct: true
          explain: >
            A parameter without a default is required, and the deployment fails
            at validation without it. allowedValues only restricts what may be
            passed and dependsOn only orders creation; neither fills a value in.
        - id: b
          label: The fragment is too incomplete to reason about without deploying it
          correct: false
          explain: >
            Everything the question needed is on the screen: the parameters
            block says which values may be omitted. Deploying to find out is
            what the validation rules exist to spare you.
        - id: c
          label: Old templates behave unpredictably and this one needs rewriting first
          correct: false
          explain: >
            The template is dated, not broken. It follows the same evaluation
            rules as one written yesterday, and the reading, not the file,
            produced the wrong answer.
    prompt: What does a deployment with no parameters do?
    options:
      - id: a
        label: >
          It deploys a Standard_D2s_v5 and fails, because vmName has no default and must be
          supplied
        correct: true
        rep: 7
        consequence: >
          Marek grunts. "Right. Which is why the pipeline has a parameter file and why
          nobody can remember what is in it."
        explain: >
          Parameters with a defaultValue are optional; those without one are required and
          deployment fails at validation if they are missing. allowedValues constrains what
          may be passed, and variables are evaluated at deployment time from expressions
          such as concat and resourceId.
      - id: b
        label: It deploys successfully with every default, since defaults exist for all parameters
        correct: false
        rep: -6
        consequence: >
          You promise a colleague they can deploy it with one command, and they cannot.
        explain: >
          Only vmSize has a default in this fragment. vmName is referenced by the nicName
          variable and has no default, so it is required.
      - id: c
        label: It fails, because dependsOn refers to a resource that is not in the template
        correct: false
        rep: -7
        consequence: >
          Twenty minutes are spent looking for a missing resource that is defined further
          down the file.
        explain: >
          dependsOn names a resource by its resource identifier and only orders the
          deployment. Whether the network interface is defined in this template or already
          exists is a separate question from what dependsOn does.
      - id: d
        label: It deploys a Standard_D4s_v5, because allowedValues takes the last entry
        correct: false
        rep: -6
        consequence: >
          A test deployment comes back double the expected size and the invoice reflects it.
        explain: >
          allowedValues restricts what can be supplied; it never selects a value. The default
          is whatever defaultValue says.
  - id: b
    type: design
    title: The size that is not allowed
    speaker: Dana Ong
    objectives: [AZ104-3.1.2]
    intro: >
      "The transport application needs more memory for peak season," says Dana.
      "Marek says a Standard_E4s_v5 is the right shape. The pipeline rejects it
      before it even reaches Azure."


      The template is the one you read this morning. The pipeline passes vmSize
      from a parameter file that now says Standard_E4s_v5.
    hint: >
      The rejection happened at validation, before Azure created anything.
      Decide which part of the template is a control doing its job, and what
      the smallest change is that permits the new value while keeping that
      control in place.
    post_mortem:
      question: >
        Dana looks at the rejected pipeline run rather than at you. "It said
        no before Azure ever saw the request. What was it protecting,
        exactly?"
      options:
        - id: a
          label: The size list is the control; a legitimate new value extends it
          correct: true
          explain: >
            allowedValues exists so only costed, agreed sizes can be deployed.
            When the requirement changes, the list changes with it; the guard
            rail keeps working and the template stays the source of truth.
        - id: b
          label: Nothing worth keeping; the pipeline is too strict for urgent changes
          correct: false
          explain: >
            The strictness is the feature. Anything that skips or removes the
            validation skips it for every future change too, and the next
            surprise size lands in production instead of in a failed run.
        - id: c
          label: The estate from a size that is wrong for the workload
          correct: false
          explain: >
            Marek sized the Standard_E4s_v5 from the workload. The requirement
            is sound; the list is simply behind it, which is a maintenance
            task, not a design error.
    prompt: What do you change?
    options:
      - id: a
        label: Add Standard_E4s_v5 to the allowedValues array in the template
        correct: true
        rep: 7
        consequence: >
          The next pipeline run deploys the larger size, and the list still stops somebody
          picking a size nobody has costed.
        explain: >
          allowedValues is validated by Resource Manager before anything is created, which is
          why the failure happens without reaching the platform. Extending the list is the
          intended way to permit a new value while keeping the guard rail.
      - id: b
        label: Remove the allowedValues array so any size can be passed
        correct: false
        rep: -6
        consequence: >
          Someone deploys a Standard_M128ms into non-production in November and Priya finds
          it in December.
        explain: >
          It unblocks the change and removes the control that made the template safe to hand
          to other people. Keep the list and maintain it.
      - id: c
        label: Change the defaultValue to Standard_E4s_v5 and stop passing the parameter
        correct: false
        rep: -7
        consequence: >
          Validation still fails, because the parameter file is still supplying a value that
          is not permitted.
        explain: >
          A default does not widen allowedValues, and a default that is not in the list is
          itself invalid. The constraint is the thing that has to change.
      - id: d
        label: Resize the virtual machine in the portal and leave the template alone
        correct: false
        rep: -8
        consequence: >
          The next pipeline run puts it back to Standard_D2s_v5 during the busiest fortnight
          of the year.
        explain: >
          If a resource is deployed from a template, the template is the source of truth.
          Changing the resource by hand creates drift that the next deployment silently
          reverses.
  - id: c
    type: troubleshoot
    title: INC-4620
    speaker: Veymark NOC
    objectives: [AZ104-3.1.2, AZ104-3.1.1]
    intro: >
      The size change was merged. The pipeline now fails at deployment, after
      validation, with a conflict about the operating system disk.


      Nothing else in the template changed, and the same template deployed cleanly
      into the non-production subscription an hour ago.
    hint: >
      Incremental mode decides which resources are sent, not which properties.
      Ask what the full definition of an existing machine says about its
      operating system disk, and what the platform is being asked to do about
      a disk that already exists.
    post_mortem:
      question: >
        Marek reads the failed attempt in the deployment history. "The
        platform told you exactly what it refused to do. What does an
        incremental deployment actually send?"
      options:
        - id: a
          label: The full definition of every resource the template names
          correct: true
          explain: >
            Incremental mode leaves out resources the template does not
            mention, but the ones it does mention are submitted whole,
            createOption included. FromImage on an existing machine therefore
            asks for the operating system disk to be built again.
        - id: b
          label: Only the properties that differ from the current state
          correct: false
          explain: >
            That is what the what-if view displays, not what the deployment
            sends. The submission is the whole resource, which is why an
            unchanged property can still cause a refusal.
        - id: c
          label: Whatever survived the last successful run of the same file
          correct: false
          explain: >
            Deployment history records attempts; it does not shape them. Each
            run is evaluated from the template and parameters alone, which is
            why non-production, starting empty, accepted the same file.
    ticket:
      ref: INC-4620
      opened: "16:40"
      reporter: Veymark NOC
      summary: Template deployment fails in production with a disk conflict after a size change.
      severity: sev3
    time_budget: 4
    investigate:
      - id: a
        action: Ask what is different about non-production
        speaker: Marek Sobczak
        reveals: >
          "Non-production is empty every morning. Production has the existing virtual
          machine and its existing disks, which have names the template also wants to use."
      - id: b
        action: Ask what mode the pipeline deploys in
        speaker: Veymark IT
        reveals: >
          The pipeline runs az deployment group create with no mode argument, which means
          incremental.
    commands:
      - id: a
        label: Read the failure from the deployment history
        cmd: az deployment group show -g rg-app -n tms-vm --query "properties.error.details[0].message" -o tsv
        output: |
          Changing property 'osDisk.createOption' is not allowed. Existing disk
          'vm-tms01-osdisk' cannot be re-created by this deployment.
        time_cost: 1
      - id: b
        label: Look at what the template asks for
        cmd: az deployment group validate -g rg-app --template-file tms-vm.json --parameters @prod.parameters.json --query "properties.validatedResources[].id" -o tsv
        output: |
          /subscriptions/.../resourceGroups/rg-app/providers/Microsoft.Compute/virtualMachines/vm-tms01
          /subscriptions/.../resourceGroups/rg-app/providers/Microsoft.Network/networkInterfaces/vm-tms01-nic
        time_cost: 1
      - id: c
        label: Ask what a deployment would actually change
        cmd: az deployment group what-if -g rg-app --template-file tms-vm.json --parameters @prod.parameters.json
        output: |
          Resource changes: 1 to modify.

          ~ Microsoft.Compute/virtualMachines/vm-tms01
            ~ properties.hardwareProfile.vmSize:  "Standard_D2s_v5" => "Standard_E4s_v5"
            ~ properties.storageProfile.osDisk.createOption: "FromImage" => "FromImage"
        time_cost: 1
      - id: d
        label: Check the current state of the machine
        cmd: az vm show -n vm-tms01 -g rg-app --query "{size:hardwareProfile.vmSize,osDisk:storageProfile.osDisk.name}" -o table
        output: |
          Size              OsDisk
          ----------------  ----------------
          Standard_D2s_v5   vm-tms01-osdisk
        time_cost: 1
    post_incident:
      path: [a, c]
      text: >
        The deployment history already names the refusal: the platform will
        not re-create vm-tms01-osdisk, so something in the submitted
        definition must be asking it to. What-if closes the loop by showing
        that the run sends the whole machine, createOption included, even
        though only the size differs. Two commands, cause and then mechanism.
        Validating the template only repeats the list of resources it names,
        and showing the machine confirms what the ticket already said, that
        it exists; neither explains why an incremental deployment would touch
        a disk nobody changed.
    fixes:
      - id: a
        label: >
          Change the template's operating system disk to createOption Attach for the existing
          disk, or resize through the template with the disk properties left as they are
        correct: true
        rep: 9
        consequence: >
          The redeployment changes only the size, the machine restarts once, and the pipeline
          is green.
        explain: >
          Incremental mode leaves resources alone that are not in the template, and it still
          sends the full definition of the resources that are. A createOption of FromImage on
          an existing machine asks the platform to build the operating system disk again,
          which it refuses. What-if is the tool that shows this before the deployment does.
      - id: b
        label: Switch the deployment to complete mode so the resource is replaced cleanly
        correct: false
        rep: -12
        consequence: >
          Complete mode deletes every resource in the resource group that is not in the
          template, which in rg-app is most of them.
        explain: >
          Complete mode is a deletion tool. In a shared resource group it removes anything
          the template does not describe, which is how people lose databases to a
          deployment.
      - id: c
        label: Delete the existing virtual machine so the template can create it fresh
        correct: false
        rep: -10
        consequence: >
          The transport application is down for forty minutes and the data disk has to be
          reattached by hand.
        explain: >
          Deleting production to make a deployment idempotent is the wrong direction. The
          template should describe the machine as it is meant to exist.
      - id: d
        label: Resize the machine in the portal and revert the template change
        correct: false
        rep: -7
        consequence: >
          Peak season is survived and the drift is still there in January when the next
          deployment runs.
        explain: >
          It restores service and abandons the source of truth. If the template cannot
          express the change, fix the template.
