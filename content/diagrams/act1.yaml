# The Meridian Azure estate as it stands when Act 1 opens, plus every node the
# act is allowed to grow. Nodes marked present: true are already there on day
# one; the rest appear when a quest deploys them.
#
# The linter rejects any diagram op in a quest that names something not declared
# here, which is what keeps the living map from filling up with typos.
#
# On coordinates: the map lays groups out in the order they are declared below
# and compacts each column, so x is an authoring hint and only y matters, as
# the order of a node within its group.
act: 1
groups:
  - id: onprem
    label: Jurong data center
    note: What Meridian ran before anyone said the word cloud.
  - id: identity
    label: Microsoft Entra ID
  - id: governance
    label: Management groups and subscriptions
  - id: edge
    label: Internet edge
  - id: hub
    label: vnet-hub (Southeast Asia)
  - id: spoke-app
    label: vnet-app (Southeast Asia)
  - id: spoke-depot
    label: vnet-depot (Southeast Asia)
  - id: data
    label: Storage and data
  - id: ops
    label: Monitoring and recovery
  - id: dr
    label: East Asia (secondary)

