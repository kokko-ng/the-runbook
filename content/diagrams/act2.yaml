# The Act 2 estate: what Veymark is designing, not what it is running.
#
# Act 2 opens with the acquisition of Straits Freight, so the diagram starts
# nearly empty on purpose. Nodes appear as designs are agreed, which makes the
# map a record of decisions rather than an inventory.
#
# On coordinates: the map lays groups out in the order they are declared below
# and compacts each column, so x is an authoring hint and only y matters, as
# the order of a node within its group.
act: 2
groups:
  - id: acquired
    label: Straits Freight (acquired)
  - id: platform
    label: Platform (management groups and subscriptions)
  - id: identity
    label: Identity and access
  - id: management
    label: Management and monitoring
  - id: connectivity
    label: Connectivity
  - id: edge
    label: Application edge
  - id: workload
    label: Workload landing zones
  - id: data
    label: Data platform
  - id: integration
    label: Integration and messaging
  - id: continuity
    label: Business continuity

