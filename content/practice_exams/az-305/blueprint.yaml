# Blueprint for the AZ-305 practice exams.
#
# Domains and skills are transcribed from the official study guide on
# learn.microsoft.com (the same source as content/objectives). Each practice
# exam deals exactly `questions` questions per domain, inside the published
# weight range, and every question names the skill it tests.
exam: AZ-305
title: Designing Microsoft Azure Infrastructure Solutions
study_guide_url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-305
skills_measured_as_of: "2026-04-17"
time_limit_minutes: 100
passing_percent: 70
domains:
  - id: AZ305-1
    title: Design identity, governance, and monitoring solutions
    weight: 25-30%
    questions: 11
    groups:
      - title: Design solutions for logging and monitoring
        skills:
          - Recommend a logging solution
          - Recommend a solution for routing logs
          - Recommend a monitoring solution
      - title: Design authentication and authorization solutions
        skills:
          - Recommend an authentication solution
          - Recommend an identity management solution
          - Recommend a solution for authorizing access to Azure resources
          - Recommend a solution for authorizing access to on-premises resources
          - Recommend a solution to manage secrets, certificates, and keys
      - title: Design governance
        skills:
          - Recommend a structure for management groups, subscriptions, and resource groups, and a strategy for resource tagging
          - Recommend a solution for managing compliance
          - Recommend a solution for identity governance
  - id: AZ305-2
    title: Design data storage solutions
    weight: 20-25%
    questions: 9
    groups:
      - title: Design data storage solutions for relational data
        skills:
          - Recommend a solution for storing relational data
          - Recommend a database service tier and compute tier
          - Recommend a solution for database scalability
          - Recommend a solution for data protection
      - title: Design data storage solutions for semi-structured and unstructured data
        skills:
          - Recommend a solution for storing semi-structured data
          - Recommend a solution for storing unstructured data
          - Recommend a data storage solution to balance features, performance, and costs
          - Recommend a data solution for protection and durability
      - title: Design data integration
        skills:
          - Recommend a solution for data integration
          - Recommend a solution for data analysis
  - id: AZ305-3
    title: Design business continuity solutions
    weight: 15-20%
    questions: 7
    groups:
      - title: Design solutions for backup and disaster recovery
        skills:
          - Recommend a recovery solution for Azure and hybrid workloads that meets recovery objectives
          - Recommend a backup and recovery solution for compute
          - Recommend a backup and recovery solution for databases
          - Recommend a backup and recovery solution for unstructured data
      - title: Design for high availability
        skills:
          - Recommend a high availability solution for compute
          - Recommend a high availability solution for relational data
          - Recommend a high availability solution for semi-structured and unstructured data
  - id: AZ305-4
    title: Design infrastructure solutions
    weight: 30-35%
    questions: 13
    groups:
      - title: Design compute solutions
        skills:
          - Specify components of a compute solution based on workload requirements
          - Recommend a virtual machine-based solution
          - Recommend a container-based solution
          - Recommend a serverless-based solution
          - Recommend a compute solution for batch processing
      - title: Design an application architecture
        skills:
          - Recommend a messaging architecture
          - Recommend an event-driven architecture
          - Recommend a solution for API integration
          - Recommend a caching solution for applications
          - Recommend an application configuration management solution
          - Recommend an automated deployment solution for applications
      - title: Design migrations
        skills:
          - Evaluate a migration solution that leverages the Microsoft Cloud Adoption Framework for Azure
          - Evaluate on-premises servers, data, and applications for migration
          - Recommend a solution for migrating workloads to infrastructure as a service (IaaS) and platform as a service (PaaS)
          - Recommend a solution for migrating databases
          - Recommend a solution for migrating unstructured data
      - title: Design network solutions
        skills:
          - Recommend a connectivity solution that connects Azure resources to the internet
          - Recommend a connectivity solution that connects Azure resources to on-premises networks
          - Recommend a solution to optimize network performance
          - Recommend a solution to optimize network security
          - Recommend a load-balancing and routing solution
