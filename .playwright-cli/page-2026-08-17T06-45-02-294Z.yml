        - paragraph [ref=f28e31]: Forty-six people, no accounts
        - paragraph [ref=f28e32]: Priya Raman · Infrastructure manager
        - generic [ref=f28e33]:
          - paragraph [ref=f28e34]: Priya Raman finds you on your fourth morning with a laptop already open, which is how she starts every conversation that ends in more work.
          - paragraph [ref=f28e35]: "\"Johor cross-dock opens in three weeks. Forty pickers on handheld scanners, six floor supervisors. HR has the roster. None of them exist in the tenant.\""
          - paragraph [ref=f28e36]: "She turns the laptop around. The roster is a spreadsheet: name, personal email, start date, site, job family. Every row says site Johor. Forty say Picker, six say Supervisor."
          - paragraph [ref=f28e37]: "\"Two more things. Ops will hire more of them - this is a ramp, not a one-off. And Marcus wants every action on the warehouse system traceable to a person, because last year the auditors asked and we could not answer.\""
          - paragraph [ref=f28e38]: Meridian's tenant is meridianlogistics.com, licensed for Microsoft Entra ID P1 through its Microsoft 365 subscription. HQ staff are synced from the on-premises domain in Kallang by Microsoft Entra Connect. The Johor warehouse floor has no domain-joined machines and no line back to the Kallang data center yet.
      - paragraph [ref=f28e39]: How do you create and organize the Johor accounts?
      - list [ref=f28e40]:
        - listitem [ref=f28e41]:
          - button "Three shared accounts - one per shift - so the scanners can be handed over without a login dance" [ref=f28e42]
        - listitem [ref=f28e43]:
          - button "Create 46 cloud users and add them to a static security group you maintain by hand" [ref=f28e44]
        - listitem [ref=f28e45]:
          - button "Create 46 cloud users with department and office location set, and a dynamic security group that matches on those attributes" [ref=f28e46]
        - listitem [ref=f28e47]:
          - button "Create a Microsoft 365 group so the supervisors get a shared mailbox and a Teams site out of it" [ref=f28e48]
