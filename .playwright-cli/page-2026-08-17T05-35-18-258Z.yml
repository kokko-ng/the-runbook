          - paragraph [ref=f1e33]: 10.101.0.0/16 - non-overlapping with on-premises and the hub, with room to subnet
        - generic [ref=f1e36]:
          - paragraph [ref=f1e37]: Why that works
          - paragraph [ref=f1e38]: Non-overlapping with 10.10.0.0/16, 10.20.0.0/16, and the 10.100.0.0/16 hub, which keeps both peering and the planned VPN viable, and large enough to carve subnets for app, data, and management tiers without revisiting the address space. Private address space is free; running out of it is not.
        - generic [ref=f1e111]:
          - paragraph [ref=f1e113]: You chose
          - paragraph [ref=f1e114]: Three /24 subnets for web, app, and data, plus a GatewaySubnet of /27
        - generic [ref=f1e117]:
          - paragraph [ref=f1e118]: Why that works
          - paragraph [ref=f1e119]: Each tier gets its own subnet so a subnet-associated NSG covers every current and future machine in that tier, and the GatewaySubnet exists before the gateway does. The gateway subnet must be named exactly GatewaySubnet and /27 leaves room for an active-active or ExpressRoute upgrade later, where /29 would not.
        - paragraph [ref=f1e122]: +8 standing → 48
        - paragraph [ref=f1e125]: +1 skill point
