  - main [ref=f21e10]:
    - generic [ref=f21e11]:
      - paragraph [ref=f21e12]: Meridian Logistics · Cloud operations
      - heading "You are the new Azure admin at a freight company that cannot afford downtime." [level=1] [ref=f21e13]
      - paragraph [ref=f21e14]: Tickets arrive. Peerings break at 09:12. The CFO asks what a gateway costs and the security officer asks why a domain controller has a public IP. Work the queue, survive the design reviews, and learn AZ-104 and AZ-305 the way you would actually meet them.
      - generic [ref=f21e15]:
        - button "Continue" [ref=f21e16]
        - button "Start over" [ref=f21e17]
      - paragraph [ref=f21e18]:
        - text: Saved on this device, Aug 17, 2026.
        - button "Delete it" [ref=f21e19]
      - paragraph [ref=f21e20]: Free, no account needed. Every answer is a choice from a list, so there is nothing to type. Your progress saves in this browser.
    - generic [ref=f21e21]:
      - generic [ref=f21e22]:
        - heading "The work" [level=2] [ref=f21e23]
        - paragraph [ref=f21e24]: 64 jobs · 131 exam objectives
      - list [ref=f21e25]:
        - listitem [ref=f21e26]:
          - generic [ref=f21e27]:
            - heading "Manage Azure identities and governance" [level=3] [ref=f21e28]
            - generic [ref=f21e29]: Act 1 · 0/6 jobs
          - list [ref=f21e30]:
            - listitem [ref=f21e31]:
              - generic [ref=f21e33]: Forty New Badges — The Johor cross-dock opens in three weeks and nobody there has an account yet.
            - listitem [ref=f21e34]:
              - generic [ref=f21e36]: Outside Help — A third-party haulier needs to see the dashboards, and the service desk is drowning in password resets.
            - listitem [ref=f21e37]:
              - generic [ref=f21e39]: Least Privilege, Loudly — Manila needs to restart a VM at two in the morning. Everyone has an opinion about how much that should cost.
            - listitem [ref=f21e40]:
              - generic [ref=f21e42]: House Rules — Nine resource groups, no naming convention, and a CFO who wants to know what Johor costs.
            - listitem [ref=f21e43]:
              - generic [ref=f21e45]: Locks and Lines — A second subscription is coming, and the last accidental deletion is still fresh.
            - listitem [ref=f21e46]:
              - generic [ref=f21e48]: Evelyn's Spreadsheet — The bill has doubled in two months and the CFO has questions in a specific order.
          - button "Jump to this chapter" [ref=f21e49]
        - listitem [ref=f21e50]:
          - generic [ref=f21e51]:
            - heading "Implement and manage storage" [level=3] [ref=f21e52]
            - generic [ref=f21e53]: Act 1 · 0/7 jobs
          - list [ref=f21e54]:
            - listitem [ref=f21e55]:
              - generic [ref=f21e57]: Ten Thousand Photos a Day — Four years of delivery photos have filled the NAS at Kallang. Something has to hold the next four.
            - listitem [ref=f21e58]:
              - generic [ref=f21e60]: The Drive Everyone Calls S — The ops team's shared drive lives on a server nobody will admit to owning. It is time it did not.
            - listitem [ref=f21e61]:
              - generic [ref=f21e63]: The Key in the Script — One credential opens everything, and it is written down in four places. Two of them are wikis.
            - listitem [ref=f21e64]:
              - generic [ref=f21e66]: The Front Door — Every storage account at Meridian accepts traffic from the entire internet. Marcus has a sprint for it.
            - listitem [ref=f21e67]:
              - generic [ref=f21e69]: Fourteen Terabytes of Dashcam — The Kallang NAS is decommissioned in six weeks. Everything on it has to be somewhere else by then.
            - listitem [ref=f21e70]:
              - generic [ref=f21e72]: The Container That Was There This Morning — Nine years of customs paperwork stops answering at 10:31. The NAS it came from was decommissioned on the fifteenth.
            - listitem [ref=f21e73]:
              - generic [ref=f21e75]: Jakarta Wants a Copy — A second office, a second regulator, and a very specific argument about what a second copy is for.
          - button "Jump to this chapter" [ref=f21e76]
        - listitem [ref=f21e77]:
          - generic [ref=f21e78]:
            - heading "Deploy and manage Azure compute resources" [level=3] [ref=f21e79]
            - generic [ref=f21e80]: Act 1 · 0/9 jobs
          - list [ref=f21e81]:
            - listitem [ref=f21e82]:
              - generic [ref=f21e84]: The Batch Window — The route optimizer runs on a tower under a desk in Kallang. It has five hours a night and no second chance.
            - listitem [ref=f21e85]:
              - generic [ref=f21e87]: The Size of Things — Evelyn has read the invoice line by line. The warehouse app server is the biggest number on it.
            - listitem [ref=f21e88]:
              - generic [ref=f21e90]: Four Sites, One Template — Ops is opening cross-docks in Johor, Batam, Penang and Surabaya. They would like them to be identical, which nothing built by hand ever is.
            - listitem [ref=f21e91]:
              - generic [ref=f21e93]: The Mode Flag — One word in a pipeline definition. Nine characters. It deletes a firewall at two in the morning.
            - listitem [ref=f21e94]:
              - generic [ref=f21e96]: The Wrong Address — The batch machine sits in the resource group where the warehouse app lives. Everyone with rights to one has rights to the other.
            - listitem [ref=f21e97]:
              - generic [ref=f21e99]: Elastic — The warehouse app tier is one machine that gets bigger every peak season. Priya would like it to be several machines that come and go.
            - listitem [ref=f21e100]:
              - generic [ref=f21e102]: EDI in a Box — Customers send electronic despatch advices at six in the morning and nothing at midnight. The service that reads them runs on a Windows box that never sleeps.
            - listitem [ref=f21e103]:
              - generic [ref=f21e105]: Where Is My Pallet — The shipment tracking page runs on an IIS server in Kallang that Marcus has been asking about for two years.
            - listitem [ref=f21e106]:
              - generic [ref=f21e108]: Go Live — A name, a certificate, a backup and a way to release without holding your breath. Then the first release.
          - button "Jump to this chapter" [ref=f21e109]
        - listitem [ref=f21e110]:
          - generic [ref=f21e111]:
            - heading "Implement and manage virtual networking" [level=3] [ref=f21e112]
            - generic [ref=f21e113]: Act 1 · 0/7 jobs
          - list [ref=f21e114]:
            - listitem [ref=f21e115]:
              - generic [ref=f21e117]: First Week, First Subnet — Meridian's warehouse app needs somewhere to live. Address space first, apologies later.
            - listitem [ref=f21e118]:
              - generic [ref=f21e120]: The Peering Problem — The spoke cannot reach the hub. Maintenance window says everything went fine.
            - listitem [ref=f21e121]:
              - generic [ref=f21e123]: Locked Out at 40 Degrees — Security tightened the rules on Friday. The scanners stopped on Monday.
            - listitem [ref=f21e124]:
              - generic [ref=f21e126]: It Resolves On My Machine — The storage endpoint resolves to a public address from inside the VNet. Nobody is happy about it.
            - listitem [ref=f21e127]:
              - generic [ref=f21e129]: The Route to Nowhere — Kallang finally gets its VPN. Then half the traffic stops coming back.
            - listitem [ref=f21e130]:
              - generic [ref=f21e132]: Peak Season — One front end held all year. Peak season starts in three weeks.
            - listitem [ref=f21e133]:
              - generic [ref=f21e135]: The Jump Box Is Gone — Marcus decommissioned the 2021 jump box on schedule. Nobody arranged what replaces it.
          - button "Jump to this chapter" [ref=f21e136]
        - listitem [ref=f21e137]:
          - generic [ref=f21e138]:
            - heading "Monitor and maintain Azure resources" [level=3] [ref=f21e139]
            - generic [ref=f21e140]: Act 1 · 0/7 jobs
          - list [ref=f21e141]:
            - listitem [ref=f21e142]:
              - generic [ref=f21e144]: Nobody Noticed — The invoice service was degraded for five hours. The first anyone heard was a customer on the phone.
            - listitem [ref=f21e145]:
              - generic [ref=f21e147]: When Did This Start — Everyone agrees the picking app got slower. Nobody agrees when. The workspace knows.
            - listitem [ref=f21e148]:
              - generic [ref=f21e150]: Four Hundred a Night — NOC Manila has stopped reading the CPU alert. Then something real happens on a Tuesday.
            - listitem [ref=f21e151]:
              - generic [ref=f21e153]: The Intermittent Hop — The warehouse app hiccups a few times an hour. Every test anyone runs passes.
            - listitem [ref=f21e154]:
              - generic [ref=f21e156]: The Day Before the Audit — A decommissioning script matches the wrong tag. The auditors arrive at nine.
            - listitem [ref=f21e157]:
              - generic [ref=f21e159]: The Tabletop — Marcus runs a ransomware exercise. It stops being an exercise about forty minutes in.
            - listitem [ref=f21e160]:
              - generic [ref=f21e162]: The Failover Drill — A competitor lost a region for nine hours. The board would like to know what we would do.
          - button "Jump to this chapter" [ref=f21e163]
        - listitem [ref=f21e164]:
          - generic [ref=f21e165]:
            - heading "Design identity, governance, and monitoring solutions" [level=3] [ref=f21e166]
            - generic [ref=f21e167]: Act 2 · 0/7 jobs
          - list [ref=f21e168]:
            - listitem [ref=f21e169]:
              - generic [ref=f21e171]: Two Tenants, One Company — Meridian bought Sunda Freight. Sunda came with two hundred staff, its own tenant, and its own opinions.
            - listitem [ref=f21e172]:
              - generic [ref=f21e174]: The Shape of the Estate — Auditors read hierarchies. Draw one they can follow, before Sunda's six subscriptions arrive.
            - listitem [ref=f21e175]:
              - generic [ref=f21e177]: Least Privilege, Most Argument — Fourteen offshore operators, six standing Owners, and a guest list nobody has read since March.
            - listitem [ref=f21e178]:
              - generic [ref=f21e180]: The ERP That Will Not Move — Kerberos, a vendor who stopped answering the phone, and thirty guests who need a 2009 web application.
            - listitem [ref=f21e181]:
              - generic [ref=f21e183]: The Spreadsheet of Secrets — Sunda kept its credentials in a workbook called passwords_final_v3. Meridian's version is only slightly better named.
            - listitem [ref=f21e184]:
              - generic [ref=f21e186]: What We Keep — The estate doubled and so did the log bill. Decide what is worth keeping, where, and for how long.
            - listitem [ref=f21e187]:
              - generic [ref=f21e189]: Quarterly Evidence — Marcus needs a compliance report every quarter. Your guardrails need to produce it without stopping Jakarta from shipping.
          - button "Jump to this chapter" [ref=f21e190]
        - listitem [ref=f21e191]:
          - generic [ref=f21e192]:
            - heading "Design data storage solutions" [level=3] [ref=f21e193]
            - generic [ref=f21e194]: Act 2 · 0/6 jobs
          - list [ref=f21e195]:
            - listitem [ref=f21e196]:
              - generic [ref=f21e198]: Two Companies, One Database — Meridian bought Sunda Freight. Now pick the relational platform that swallows both warehouse systems without a rewrite.
            - listitem [ref=f21e199]:
              - generic [ref=f21e201]: Twelve Thousand Boxes That Talk — The tracked container fleet ships next quarter and nobody has decided where its telemetry lands.
            - listitem [ref=f21e202]:
              - generic [ref=f21e204]: Proof of Delivery, Proof of Everything — Forty thousand photos a day and six terabytes of dashcam footage a month. Somebody has to say where it all lives and for how long.
            - listitem [ref=f21e205]:
              - generic [ref=f21e207]: The Jakarta Clause — Backups, retention, and one contract clause that decides where Meridian's second copy is allowed to exist.
            - listitem [ref=f21e208]:
              - generic [ref=f21e210]: The Laptop Under The Desk — Sunda's nightly feed into Meridian runs on a laptop in a Jakarta office. Design what replaces it before someone unplugs it.
            - listitem [ref=f21e211]:
              - generic [ref=f21e213]: Month End, Every Month — Finance has been querying production for four years. On the first month end after the merger, production notices.
          - button "Jump to this chapter" [ref=f21e214]
        - listitem [ref=f21e215]:
          - generic [ref=f21e216]:
            - heading "Design business continuity solutions" [level=3] [ref=f21e217]
            - generic [ref=f21e218]: Act 2 · 0/6 jobs
          - list [ref=f21e219]:
            - listitem [ref=f21e220]:
              - generic [ref=f21e222]: What If Southeast Asia Goes Down — A competitor's outage made the news and the board wants a number. Numbers first, architecture second.
            - listitem [ref=f21e223]:
              - generic [ref=f21e225]: Nobody Backed It Up — Sunda Freight arrives with forty servers, seven years of tax retention, and no backups at all.
            - listitem [ref=f21e226]:
              - generic [ref=f21e228]: The Database Question — Retention, a dropped table, and the difference between a replica and a backup.
            - listitem [ref=f21e229]:
              - generic [ref=f21e231]: Manifests and Photographs — Forty terabytes of proof of delivery, a customs auditor, and an ops share nobody owns.
            - listitem [ref=f21e232]:
              - generic [ref=f21e234]: The Drill — A recovery plan is a hypothesis until somebody runs it at two in the morning.
            - listitem [ref=f21e235]:
              - generic [ref=f21e237]: The Price of Standing By — Evelyn has the five-month invoice for a region that has served no traffic. She has questions.
          - button "Jump to this chapter" [ref=f21e238]
        - listitem [ref=f21e239]:
          - generic [ref=f21e240]:
            - heading "Design infrastructure solutions" [level=3] [ref=f21e241]
            - generic [ref=f21e242]: Act 2 · 0/9 jobs
          - list [ref=f21e243]:
            - listitem [ref=f21e244]:
              - generic [ref=f21e246]: The Acquisition — Meridian bought a competitor with a data center in it. You have nine months and a framework.
            - listitem [ref=f21e247]:
              - generic [ref=f21e249]: Waves — Two hundred servers, forty-eight terabytes, and a six-hour window at Lunar New Year.
            - listitem [ref=f21e250]:
              - generic [ref=f21e252]: The Jakarta Uplink — Two hundred staff, one circuit, and an egress bill nobody forecast.
            - listitem [ref=f21e253]:
              - generic [ref=f21e255]: What Runs Where — An ERP that must be a virtual machine, and a shipping service that must not be.
            - listitem [ref=f21e256]:
              - generic [ref=f21e258]: The Firehose — Eleven thousand containers, each with opinions about its own temperature.
            - listitem [ref=f21e259]:
              - generic [ref=f21e261]: The Night Run — Nine hundred routes, four hours, and a cost ceiling Evelyn wrote in ink.
            - listitem [ref=f21e262]:
              - generic [ref=f21e264]: The Partner API — Forty partners, one tracking endpoint, and a typhoon in the South China Sea.
            - listitem [ref=f21e265]:
              - generic [ref=f21e267]: The Second Region — The board funded two regions. Nobody said which traffic goes to which one.
            - listitem [ref=f21e268]:
              - generic [ref=f21e270]: The Last Design Review — Releases stop happening on Friday evening, and the estate on the map is the one you drew.
          - button "Jump to this chapter" [ref=f21e271]
