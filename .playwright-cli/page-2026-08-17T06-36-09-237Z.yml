  - main [ref=f15e289]:
    - generic [ref=f15e292]:
      - generic [ref=f15e293]:
        - paragraph [ref=f15e294]: Forty-six people, no accounts
        - paragraph [ref=f15e295]: Priya Raman · Infrastructure manager
        - generic [ref=f15e296]:
          - paragraph [ref=f15e297]: Priya Raman finds you on your fourth morning with a laptop already open, which is how she starts every conversation that ends in more work.
          - paragraph [ref=f15e298]: "\"Johor cross-dock opens in three weeks. Forty pickers on handheld scanners, six floor supervisors. HR has the roster. None of them exist in the tenant.\""
          - paragraph [ref=f15e299]: "She turns the laptop around. The roster is a spreadsheet: name, personal email, start date, site, job family. Every row says site Johor. Forty say Picker, six say Supervisor."
          - paragraph [ref=f15e300]: "\"Two more things. Ops will hire more of them - this is a ramp, not a one-off. And Marcus wants every action on the warehouse system traceable to a person, because last year the auditors asked and we could not answer.\""
          - paragraph [ref=f15e301]: Meridian's tenant is meridianlogistics.com, licensed for Microsoft Entra ID P1 through its Microsoft 365 subscription. HQ staff are synced from the on-premises domain in Kallang by Microsoft Entra Connect. The Johor warehouse floor has no domain-joined machines and no line back to the Kallang data center yet.
      - paragraph [ref=f15e302]: How do you create and organize the Johor accounts?
      - list [ref=f15e303]:
        - listitem [ref=f15e304]:
          - button "Three shared accounts - one per shift - so the scanners can be handed over without a login dance" [ref=f15e305]
        - listitem [ref=f15e306]:
          - button "Create 46 cloud users and add them to a static security group you maintain by hand" [ref=f15e307]
        - listitem [ref=f15e308]:
          - button "Create 46 cloud users with department and office location set, and a dynamic security group that matches on those attributes" [ref=f15e309]
        - listitem [ref=f15e310]:
          - button "Create a Microsoft 365 group so the supervisors get a shared mailbox and a Teams site out of it" [ref=f15e311]
