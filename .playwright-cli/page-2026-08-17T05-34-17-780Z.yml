            - paragraph [ref=e69]: Desmond Toh has been Meridian's senior cloud admin for six years and looks like he has slept through none of them. He drops a printout on your desk on your third morning.
            - paragraph [ref=e70]: "\"New warehouse management system. Ops wants it in Azure by month end. You're building the network. I'm reviewing it, which means I'm going to find something wrong, so make it something small.\""
            - paragraph [ref=e71]: The printout is a spreadsheet of every network Meridian runs. On-premises uses 10.10.0.0/16 in Kallang and 10.20.0.0/16 in the Johor cross-dock. The hub VNet in Azure is 10.100.0.0/16. There is a site-to-site VPN planned between Kallang and the hub before the end of the quarter.
            - paragraph [ref=e72]: "\"Warehouse app needs room for about forty machines today,\" Desmond says, \"and Ops will ask for more, because Ops always asks for more. Pick the address space for the new spoke VNet.\""
