          - paragraph [ref=e140]: Desmond puts the printout back on your desk without sitting down.
          - paragraph [ref=e141]: Why that fails
          - paragraph [ref=e142]: Overlapping address space is the one networking mistake Azure cannot route around. VNet peering and site-to-site VPN both require non-overlapping ranges; peering will refuse to be created and the VPN would blackhole traffic between the sites. Familiarity is not worth an address space you can never connect to anything.
