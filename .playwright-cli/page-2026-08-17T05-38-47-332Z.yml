          - paragraph [ref=f4e137]: You chose
          - paragraph [ref=f4e138]: 10.101.0.0/16 - non-overlapping with on-premises and the hub, with room to subnet
        - generic [ref=f4e141]:
          - paragraph [ref=f4e142]: Why that works
          - paragraph [ref=f4e143]: Non-overlapping with 10.10.0.0/16, 10.20.0.0/16, and the 10.100.0.0/16 hub, which keeps both peering and the planned VPN viable, and large enough to carve subnets for app, data, and management tiers without revisiting the address space. Private address space is free; running out of it is not.
        - paragraph [ref=f4e146]: +8 standing → 58
        - paragraph [ref=f4e149]: +1 skill point
        - generic [ref=f4e172]:
          - paragraph [ref=f4e174]: You chose
          - paragraph [ref=f4e175]: Three /24 subnets for web, app, and data, plus a GatewaySubnet of /27
        - generic [ref=f4e178]:
          - paragraph [ref=f4e179]: Why that works
          - paragraph [ref=f4e180]: Each tier gets its own subnet so a subnet-associated NSG covers every current and future machine in that tier, and the GatewaySubnet exists before the gateway does. The gateway subnet must be named exactly GatewaySubnet and /27 leaves room for an active-active or ExpressRoute upgrade later, where /29 would not.
        - paragraph [ref=f4e183]: +8 standing → 66
        - paragraph [ref=f4e186]: +1 skill point
        - generic [ref=f4e213]:
          - paragraph [ref=f4e215]: You chose
          - paragraph [ref=f4e216]: Create VNet peering between vnet-warehouse-sea and vnet-hub-sea
        - generic [ref=f4e219]:
          - paragraph [ref=f4e220]: Why that works
          - paragraph [ref=f4e221]: "Peering is the direct answer for two VNets in the same region: traffic stays on the Microsoft backbone, there is no gateway to deploy or pay an hourly rate for, and latency is effectively that of a single VNet. Remember peering is not transitive - a second spoke would need its own peering to the hub."
        - paragraph [ref=f4e224]: +8 standing → 74
        - paragraph [ref=f4e227]: +1 skill point
        - paragraph [ref=f4e230]: Skill treeVirtual networks and subnets is complete.
