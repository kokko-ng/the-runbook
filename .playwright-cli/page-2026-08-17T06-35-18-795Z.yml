  - main [ref=f14e10]:
    - generic [ref=f14e11]:
      - paragraph [ref=f14e12]: Meridian Logistics · Cloud operations
      - heading "You are the new Azure admin at a freight company that cannot afford downtime." [level=1] [ref=f14e13]
      - paragraph [ref=f14e14]: Tickets arrive. Peerings break at 09:12. The CFO asks what a gateway costs and the security officer asks why a domain controller has a public IP. Work the queue, survive the design reviews, and learn AZ-104 and AZ-305 the way you would actually meet them.
      - button "Start your first day" [ref=f14e16]
      - paragraph [ref=f14e17]: Free, no account needed. Every answer is a choice from a list, so there is nothing to type. Your progress saves in this browser.
    - generic [ref=f14e18]:
      - generic [ref=f14e19]:
        - heading "The work" [level=2] [ref=f14e20]
        - paragraph [ref=f14e21]: 64 jobs · 131 exam objectives
      - list [ref=f14e22]:
        - listitem [ref=f14e23]:
          - generic [ref=f14e24]:
            - heading "Manage Azure identities and governance" [level=3] [ref=f14e25]
            - generic [ref=f14e26]: Act 1 · 0/6 jobs
          - list [ref=f14e27]:
            - listitem [ref=f14e28]:
              - generic [ref=f14e30]: Forty New Badges — The Johor cross-dock opens in three weeks and nobody there has an account yet.
            - listitem [ref=f14e31]:
              - generic [ref=f14e33]: Outside Help — A third-party haulier needs to see the dashboards, and the service desk is drowning in password resets.
            - listitem [ref=f14e34]:
              - generic [ref=f14e36]: Least Privilege, Loudly — Manila needs to restart a VM at two in the morning. Everyone has an opinion about how much that should cost.
            - listitem [ref=f14e37]:
              - generic [ref=f14e39]: House Rules — Nine resource groups, no naming convention, and a CFO who wants to know what Johor costs.
            - listitem [ref=f14e40]:
              - generic [ref=f14e42]: Locks and Lines — A second subscription is coming, and the last accidental deletion is still fresh.
            - listitem [ref=f14e43]:
              - generic [ref=f14e45]: Evelyn's Spreadsheet — The bill has doubled in two months and the CFO has questions in a specific order.
        - listitem [ref=f14e46]:
          - generic [ref=f14e47]:
            - heading "Implement and manage storage" [level=3] [ref=f14e48]
            - generic [ref=f14e49]: Act 1 · 0/7 jobs
          - list [ref=f14e50]:
            - listitem [ref=f14e51]:
              - generic [ref=f14e53]: Ten Thousand Photos a Day — Four years of delivery photos have filled the NAS at Kallang. Something has to hold the next four.
            - listitem [ref=f14e54]:
              - generic [ref=f14e56]: The Drive Everyone Calls S — The ops team's shared drive lives on a server nobody will admit to owning. It is time it did not.
            - listitem [ref=f14e57]:
              - generic [ref=f14e59]: The Key in the Script — One credential opens everything, and it is written down in four places. Two of them are wikis.
            - listitem [ref=f14e60]:
              - generic [ref=f14e62]: The Front Door — Every storage account at Meridian accepts traffic from the entire internet. Marcus has a sprint for it.
            - listitem [ref=f14e63]:
              - generic [ref=f14e65]: Fourteen Terabytes of Dashcam — The Kallang NAS is decommissioned in six weeks. Everything on it has to be somewhere else by then.
            - listitem [ref=f14e66]:
              - generic [ref=f14e68]: The Container That Was There This Morning — Nine years of customs paperwork stops answering at 10:31. The NAS it came from was decommissioned on the fifteenth.
            - listitem [ref=f14e69]:
              - generic [ref=f14e71]: Jakarta Wants a Copy — A second office, a second regulator, and a very specific argument about what a second copy is for.
        - listitem [ref=f14e72]:
          - generic [ref=f14e73]:
            - heading "Deploy and manage Azure compute resources" [level=3] [ref=f14e74]
            - generic [ref=f14e75]: Act 1 · 0/9 jobs
          - list [ref=f14e76]:
            - listitem [ref=f14e77]:
              - generic [ref=f14e79]: The Batch Window — The route optimizer runs on a tower under a desk in Kallang. It has five hours a night and no second chance.
            - listitem [ref=f14e80]:
              - generic [ref=f14e82]: The Size of Things — Evelyn has read the invoice line by line. The warehouse app server is the biggest number on it.
            - listitem [ref=f14e83]:
              - generic [ref=f14e85]: Four Sites, One Template — Ops is opening cross-docks in Johor, Batam, Penang and Surabaya. They would like them to be identical, which nothing built by hand ever is.
            - listitem [ref=f14e86]:
              - generic [ref=f14e88]: The Mode Flag — One word in a pipeline definition. Nine characters. It deletes a firewall at two in the morning.
            - listitem [ref=f14e89]:
              - generic [ref=f14e91]: The Wrong Address — The batch machine sits in the resource group where the warehouse app lives. Everyone with rights to one has rights to the other.
            - listitem [ref=f14e92]:
              - generic [ref=f14e94]: Elastic — The warehouse app tier is one machine that gets bigger every peak season. Priya would like it to be several machines that come and go.
            - listitem [ref=f14e95]:
              - generic [ref=f14e97]: EDI in a Box — Customers send electronic despatch advices at six in the morning and nothing at midnight. The service that reads them runs on a Windows box that never sleeps.
            - listitem [ref=f14e98]:
              - generic [ref=f14e100]: Where Is My Pallet — The shipment tracking page runs on an IIS server in Kallang that Marcus has been asking about for two years.
            - listitem [ref=f14e101]:
              - generic [ref=f14e103]: Go Live — A name, a certificate, a backup and a way to release without holding your breath. Then the first release.
        - listitem [ref=f14e104]:
          - generic [ref=f14e105]:
            - heading "Implement and manage virtual networking" [level=3] [ref=f14e106]
            - generic [ref=f14e107]: Act 1 · 0/7 jobs
          - list [ref=f14e108]:
            - listitem [ref=f14e109]:
              - generic [ref=f14e111]: First Week, First Subnet — Meridian's warehouse app needs somewhere to live. Address space first, apologies later.
            - listitem [ref=f14e112]:
              - generic [ref=f14e114]: The Peering Problem — The spoke cannot reach the hub. Maintenance window says everything went fine.
            - listitem [ref=f14e115]:
              - generic [ref=f14e117]: Locked Out at 40 Degrees — Security tightened the rules on Friday. The scanners stopped on Monday.
            - listitem [ref=f14e118]:
              - generic [ref=f14e120]: It Resolves On My Machine — The storage endpoint resolves to a public address from inside the VNet. Nobody is happy about it.
            - listitem [ref=f14e121]:
              - generic [ref=f14e123]: The Route to Nowhere — Kallang finally gets its VPN. Then half the traffic stops coming back.
            - listitem [ref=f14e124]:
              - generic [ref=f14e126]: Peak Season — One front end held all year. Peak season starts in three weeks.
            - listitem [ref=f14e127]:
              - generic [ref=f14e129]: The Jump Box Is Gone — Marcus decommissioned the 2021 jump box on schedule. Nobody arranged what replaces it.
        - listitem [ref=f14e130]:
          - generic [ref=f14e131]:
            - heading "Monitor and maintain Azure resources" [level=3] [ref=f14e132]
            - generic [ref=f14e133]: Act 1 · 0/7 jobs
          - list [ref=f14e134]:
            - listitem [ref=f14e135]:
              - generic [ref=f14e137]: Nobody Noticed — The invoice service was degraded for five hours. The first anyone heard was a customer on the phone.
            - listitem [ref=f14e138]:
              - generic [ref=f14e140]: When Did This Start — Everyone agrees the picking app got slower. Nobody agrees when. The workspace knows.
            - listitem [ref=f14e141]:
              - generic [ref=f14e143]: Four Hundred a Night — NOC Manila has stopped reading the CPU alert. Then something real happens on a Tuesday.
            - listitem [ref=f14e144]:
              - generic [ref=f14e146]: The Intermittent Hop — The warehouse app hiccups a few times an hour. Every test anyone runs passes.
            - listitem [ref=f14e147]:
              - generic [ref=f14e149]: The Day Before the Audit — A decommissioning script matches the wrong tag. The auditors arrive at nine.
            - listitem [ref=f14e150]:
              - generic [ref=f14e152]: The Tabletop — Marcus runs a ransomware exercise. It stops being an exercise about forty minutes in.
            - listitem [ref=f14e153]:
              - generic [ref=f14e155]: The Failover Drill — A competitor lost a region for nine hours. The board would like to know what we would do.
        - listitem [ref=f14e156]:
          - generic [ref=f14e157]:
            - heading "Design identity, governance, and monitoring solutions" [level=3] [ref=f14e158]
            - generic [ref=f14e159]: Act 2 · 0/7 jobs
          - list [ref=f14e160]:
            - listitem [ref=f14e161]:
              - generic [ref=f14e163]: Two Tenants, One Company — Meridian bought Sunda Freight. Sunda came with two hundred staff, its own tenant, and its own opinions.
            - listitem [ref=f14e164]:
              - generic [ref=f14e166]: The Shape of the Estate — Auditors read hierarchies. Draw one they can follow, before Sunda's six subscriptions arrive.
            - listitem [ref=f14e167]:
              - generic [ref=f14e169]: Least Privilege, Most Argument — Fourteen offshore operators, six standing Owners, and a guest list nobody has read since March.
            - listitem [ref=f14e170]:
              - generic [ref=f14e172]: The ERP That Will Not Move — Kerberos, a vendor who stopped answering the phone, and thirty guests who need a 2009 web application.
            - listitem [ref=f14e173]:
              - generic [ref=f14e175]: The Spreadsheet of Secrets — Sunda kept its credentials in a workbook called passwords_final_v3. Meridian's version is only slightly better named.
            - listitem [ref=f14e176]:
              - generic [ref=f14e178]: What We Keep — The estate doubled and so did the log bill. Decide what is worth keeping, where, and for how long.
            - listitem [ref=f14e179]:
              - generic [ref=f14e181]: Quarterly Evidence — Marcus needs a compliance report every quarter. Your guardrails need to produce it without stopping Jakarta from shipping.
        - listitem [ref=f14e182]:
          - generic [ref=f14e183]:
            - heading "Design data storage solutions" [level=3] [ref=f14e184]
            - generic [ref=f14e185]: Act 2 · 0/6 jobs
          - list [ref=f14e186]:
            - listitem [ref=f14e187]:
              - generic [ref=f14e189]: Two Companies, One Database — Meridian bought Sunda Freight. Now pick the relational platform that swallows both warehouse systems without a rewrite.
            - listitem [ref=f14e190]:
              - generic [ref=f14e192]: Twelve Thousand Boxes That Talk — The tracked container fleet ships next quarter and nobody has decided where its telemetry lands.
            - listitem [ref=f14e193]:
              - generic [ref=f14e195]: Proof of Delivery, Proof of Everything — Forty thousand photos a day and six terabytes of dashcam footage a month. Somebody has to say where it all lives and for how long.
            - listitem [ref=f14e196]:
              - generic [ref=f14e198]: The Jakarta Clause — Backups, retention, and one contract clause that decides where Meridian's second copy is allowed to exist.
            - listitem [ref=f14e199]:
              - generic [ref=f14e201]: The Laptop Under The Desk — Sunda's nightly feed into Meridian runs on a laptop in a Jakarta office. Design what replaces it before someone unplugs it.
            - listitem [ref=f14e202]:
              - generic [ref=f14e204]: Month End, Every Month — Finance has been querying production for four years. On the first month end after the merger, production notices.
        - listitem [ref=f14e205]:
          - generic [ref=f14e206]:
            - heading "Design business continuity solutions" [level=3] [ref=f14e207]
            - generic [ref=f14e208]: Act 2 · 0/6 jobs
          - list [ref=f14e209]:
            - listitem [ref=f14e210]:
              - generic [ref=f14e212]: What If Southeast Asia Goes Down — A competitor's outage made the news and the board wants a number. Numbers first, architecture second.
            - listitem [ref=f14e213]:
              - generic [ref=f14e215]: Nobody Backed It Up — Sunda Freight arrives with forty servers, seven years of tax retention, and no backups at all.
            - listitem [ref=f14e216]:
              - generic [ref=f14e218]: The Database Question — Retention, a dropped table, and the difference between a replica and a backup.
            - listitem [ref=f14e219]:
              - generic [ref=f14e221]: Manifests and Photographs — Forty terabytes of proof of delivery, a customs auditor, and an ops share nobody owns.
            - listitem [ref=f14e222]:
              - generic [ref=f14e224]: The Drill — A recovery plan is a hypothesis until somebody runs it at two in the morning.
            - listitem [ref=f14e225]:
              - generic [ref=f14e227]: The Price of Standing By — Evelyn has the five-month invoice for a region that has served no traffic. She has questions.
        - listitem [ref=f14e228]:
          - generic [ref=f14e229]:
            - heading "Design infrastructure solutions" [level=3] [ref=f14e230]
            - generic [ref=f14e231]: Act 2 · 0/9 jobs
          - list [ref=f14e232]:
            - listitem [ref=f14e233]:
              - generic [ref=f14e235]: The Acquisition — Meridian bought a competitor with a data center in it. You have nine months and a framework.
            - listitem [ref=f14e236]:
              - generic [ref=f14e238]: Waves — Two hundred servers, forty-eight terabytes, and a six-hour window at Lunar New Year.
            - listitem [ref=f14e239]:
              - generic [ref=f14e241]: The Jakarta Uplink — Two hundred staff, one circuit, and an egress bill nobody forecast.
            - listitem [ref=f14e242]:
              - generic [ref=f14e244]: What Runs Where — An ERP that must be a virtual machine, and a shipping service that must not be.
            - listitem [ref=f14e245]:
              - generic [ref=f14e247]: The Firehose — Eleven thousand containers, each with opinions about its own temperature.
            - listitem [ref=f14e248]:
              - generic [ref=f14e250]: The Night Run — Nine hundred routes, four hours, and a cost ceiling Evelyn wrote in ink.
            - listitem [ref=f14e251]:
              - generic [ref=f14e253]: The Partner API — Forty partners, one tracking endpoint, and a typhoon in the South China Sea.
            - listitem [ref=f14e254]:
              - generic [ref=f14e256]: The Second Region — The board funded two regions. Nobody said which traffic goes to which one.
            - listitem [ref=f14e257]:
              - generic [ref=f14e259]: The Last Design Review — Releases stop happening on Friday evening, and the estate on the map is the one you drew.
