# One ruff configuration for the whole repository: the backend, the content
# pipeline and the deploy scripts are all held to the same line and the same
# rules. It used to live in backend/pyproject.toml, which left deploy/ on ruff's
# defaults and quietly held it to different rules than everything else.
line-length = 100
target-version = "py313"

# Where the first-party packages live. Without this, ruff reads the Django apps
# as third-party and sorts "from content_pipeline import core" in among the
# django imports.
src = ["backend"]

# Django writes these, and rewrites them whenever a model changes. Holding
# generated files to a line length only means reformatting them by hand after
# every makemigrations.
extend-exclude = ["**/migrations/**"]

[lint]
select = ["E", "F", "I", "UP", "B"]
