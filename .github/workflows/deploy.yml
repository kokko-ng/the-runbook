name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued run should replace an older one, not race it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Build and ship to PythonAnywhere
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --- build ---------------------------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --python ${{ env.PYTHON_VERSION }}

      - name: Validate content
        working-directory: backend
        run: uv run python manage.py validate_content --matrix

      - name: Backend tests
        working-directory: backend
        run: uv run pytest -q

      - name: Compile content
        working-directory: backend
        run: uv run python manage.py compile_content

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Engine tests
        working-directory: frontend
        run: npx vitest run

      - name: Production build
        working-directory: frontend
        run: npx vue-tsc --noEmit && npx vite build

      # PythonAnywhere has no Node toolchain, so the built bundle travels there
      # as a tarball rather than being rebuilt on the host.
      - name: Package the build
        run: tar -czf dist.tar.gz -C frontend/dist .

      # --- ship ----------------------------------------------------------
      - name: Upload the build to PythonAnywhere
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            -F "content=@dist.tar.gz" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/files/path/home/${PA_USER}/incoming/dist.tar.gz"

      # PythonAnywhere's API can create a console but cannot run one unattended,
      # so the deploy is requested by dropping a marker file that an hourly
      # scheduled task on the host picks up.
      - name: Request the deploy
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          echo "${GITHUB_SHA}" > request.txt
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            -F "content=@request.txt" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/files/path/home/${PA_USER}/deploy_request/${GITHUB_SHA}"

      # If a long-lived console is configured, poke it so the deploy starts now
      # instead of at the top of the hour. Optional: failure here is not fatal,
      # the scheduled task still picks the request up.
      - name: Start the deploy immediately if a console is available
        continue-on-error: true
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_CONSOLE_ID: ${{ secrets.PYTHONANYWHERE_CONSOLE_ID }}
        run: |
          if [ -z "${PA_CONSOLE_ID}" ]; then
            echo "No console configured; waiting for the hourly task instead."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            --data-urlencode "input=bash ~/the-runbook/deploy/pa_poll.sh"$'\n' \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/consoles/${PA_CONSOLE_ID}/send_input/"

      - name: Wait for the deploy to finish
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
        run: |
          base="https://www.pythonanywhere.com/api/v0/user/${PA_USER}/files/path/home/${PA_USER}/deploy_status"
          # Up to ~70 minutes: enough for the hourly task to come round even if
          # no console is configured.
          for attempt in $(seq 1 140); do
            if curl --fail --silent -H "Authorization: Token ${PA_TOKEN}" \
                 "${base}/${GITHUB_SHA}.done" -o done.log 2>/dev/null; then
              echo "Deploy finished."
              cat done.log
              exit 0
            fi
            if curl --fail --silent -H "Authorization: Token ${PA_TOKEN}" \
                 "${base}/${GITHUB_SHA}.failed" -o failed.log 2>/dev/null; then
              echo "Deploy failed on PythonAnywhere:"
              cat failed.log
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for the deploy to report back."
          echo "Check that the hourly 'pa_poll.sh' scheduled task is enabled."
          exit 1

      - name: Reload the web app
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/webapps/${PA_DOMAIN}/reload/"

      - name: Smoke test
        env:
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          sleep 10
          health=$(curl --fail --silent --show-error "https://${PA_DOMAIN}/api/health")
          echo "${health}"
          echo "${health}" | grep -q '"status": *"ok"' || {
            echo "Health check did not report ok."
            exit 1
          }
          curl --fail --silent --show-error -o /dev/null "https://${PA_DOMAIN}/"
          echo "Home page served."
